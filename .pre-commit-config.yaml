# One hook running the whole of `just check`, so a local commit is checked exactly as CI checks
# it, plus two hooks on the commit message itself.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: just-check
        name: just check (all gates, both toolchains)
        entry: just check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit] # without this the hook ALSO runs at commit-msg (twice per commit)
      - id: commit-message-style
        name: commit message style (length, lowercase, no dashes, no volatile refs, no banned words)
        entry: python3 scripts/commitlint.py
        language: system
        stages: [commit-msg] # receives the commit-message file path; stdlib-only, no sync
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, test, refactor, perf, build, ci, chore, revert]
