# Mirrors `just check` exactly (AGENTS.md gate 6): one hook, the whole gate.
# Anything less than the full gate here would let local commits drift from CI.
# Plus commit-msg enforcement of Conventional Commits (AGENTS.md "Commits").
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: just-check
        name: just check (all gates, both toolchains)
        entry: just check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit] # without this the hook ALSO runs at commit-msg (twice per commit)
      - id: commit-subject-style
        name: commit subject style (AGENTS.md rules on length, lowercase, no trailing period)
        entry: python3 scripts/commitlint.py
        language: system
        stages: [commit-msg] # receives the commit-message file path; stdlib-only, no sync
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, test, refactor, perf, build, ci, chore, revert]
