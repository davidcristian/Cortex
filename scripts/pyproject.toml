[project]
name = "repo-gates"
version = "0.1.0"
description = "Repo-wide hard-gate tooling: the line-cap scan, the punctuating-dash scan, the cross-language constant check, the Rust coverage gate, the CI path classifier, and the commit-message style hook."
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-randomly>=4.1",
  "pyright>=1.1.390",
  "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: exercises live external systems; excluded from coverage gate and CI",
]
# `--randomly-seed` is FIXED, so the order is not the collection order and is still the same
# order twice (ADR-0002 shuffle addendum). The number is arbitrary and frozen: changing it
# reshuffles this suite for no reason, and it differs from the other two suites' seeds on
# purpose, so nobody reads three independent numbers as one value that has to agree.
# `just shuffle` is the deliberate sweep over other seeds; pytest prints the seed in its header,
# so a red run names the order it ran in.
addopts = "--cov=. --cov-branch --cov-report=term-missing --cov-fail-under=100 --strict-markers -m \"not integration\" --randomly-seed=7919"

[tool.coverage.run]
branch = true
# Measure the whole tree so a new script is gated by default (fail closed);
# a module must be excluded here to escape, never merely forgotten.
omit = ["tests/*", ".venv/*"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["."]
exclude = [".venv", "**/__pycache__", ".pytest_cache"]
