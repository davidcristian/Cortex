[project]
name = "repo-gates"
version = "0.1.0"
description = "Repo-wide hard-gate tooling: the line-cap scan, the Rust coverage gate, the CI path classifier, and the commit-subject style hook."
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pyright>=1.1.390",
  "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: exercises live external systems; excluded from coverage gate and CI",
]
addopts = "--cov=linecap --cov=coverage_gate --cov=ci_paths --cov=commitlint --cov-branch --cov-report=term-missing --cov-fail-under=100 --strict-markers -m \"not integration\""

[tool.coverage.run]
branch = true

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["linecap.py", "coverage_gate.py", "ci_paths.py", "commitlint.py", "tests"]
