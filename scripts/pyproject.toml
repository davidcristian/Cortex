[project]
name = "repo-checks"
version = "0.1.0"
description = "This repository's own checks: the cross-tree scans, the Rust coverage check, the CI path classifier and the commit-message style hook."
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-randomly>=4.1",
  "pyright>=1.1.390",
  "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: exercises live external systems; excluded from coverage gate and CI",
]
# `--randomly-seed` is fixed, so the order is not the collection order and is the same twice. The
# number is arbitrary and deliberately unlike the other suites' seeds, so nobody reads the four as
# one value that has to agree. `just shuffle` is what runs the other orders.
addopts = "--cov=. --cov-branch --cov-report=term-missing --cov-fail-under=100 --strict-markers -m \"not integration\" --randomly-seed=7919"

[tool.coverage.run]
branch = true
# Measure the whole tree, so a new module is covered unless it is excluded here on purpose.
omit = ["tests/*", ".venv/*"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["."]
exclude = [".venv", "**/__pycache__", ".pytest_cache"]
