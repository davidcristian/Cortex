[project]
name = "cortex-session"
version = "0.0.0"
description = "Redis adapter for the core's SessionStore port: the state that survives swaps."
requires-python = ">=3.12"
dependencies = [
  "cortex-core",
  "redis>=5.0",
]

[tool.uv.sources]
cortex-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_session"]
