[project]
name = "cortex-model-manager"
version = "0.0.0"
description = "Model-host supervisor sidecar (one llama-server child per logical model) + the ModelHost HTTP adapter (ADR-0030)."
requires-python = ">=3.12"
dependencies = [
  "cortex-core",
  "httpx>=0.27",
  "pydantic-settings>=2.6",
  "starlette>=1.0",
  "uvicorn>=0.30",
]

[tool.uv.sources]
cortex-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_model_manager"]
