[project]
name = "cortex-tools"
version = "0.0.0"
description = "MCP-client adapter for the core's ToolRegistry port: audited tool dispatch over MCP servers (ADR-0009)."
requires-python = ">=3.12"
dependencies = [
  "cortex-core",
  "mcp>=1.23,<2",
]

[tool.uv.sources]
cortex-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_tools"]
