[project]
name = "cortex-settings"
version = "0.0.0"
description = "Reads a settings class from the environment, naming a refused value by its variable."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11",
  "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_settings"]
