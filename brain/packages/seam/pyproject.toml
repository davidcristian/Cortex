[project]
name = "cortex-seam"
version = "0.0.0"
description = "The body<->brain gRPC seam: committed generated wire code plus a typed facade."
requires-python = ">=3.12"
dependencies = [
  # Floors track the committed gencode's import-time minimums; bump on every regen (ADR-0003).
  "grpcio>=1.81.1",
  "protobuf>=6.33.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_seam"]
