[project]
name = "cortex-seam"
version = "0.0.0"
description = "The gRPC interface between body and brain: committed generated wire code plus a typed facade."
requires-python = ">=3.12"
dependencies = [
  # The minimums the committed generated code needs to import; raise them on every regeneration.
  "grpcio>=1.81.1",
  "protobuf>=6.33.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_seam"]
