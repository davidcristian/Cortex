[project]
name = "cortex-body-client"
version = "0.0.0"
description = "gRPC client adapter for the core's BodyGateway port: the brain calls the host body's BodyService."
requires-python = ">=3.12"
dependencies = [
  "cortex-core",
  "cortex-seam",
  # The minimum the committed generated code needs to import; raise it on every regeneration.
  "grpcio>=1.81.1",
]

[tool.uv.sources]
cortex-core = { workspace = true }
cortex-seam = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_body_client"]
