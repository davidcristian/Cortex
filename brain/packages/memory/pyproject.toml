[project]
name = "cortex-memory"
version = "0.0.0"
description = "pgvector adapter for the core's MemoryStore port: durable, cross-session recall (ADR-0008)."
requires-python = ">=3.12"
dependencies = [
  "cortex-core",
  "asyncpg>=0.30",
]

[tool.uv.sources]
cortex-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_memory"]
