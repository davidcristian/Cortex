[project]
name = "cortex-orchestrator"
version = "0.0.0"
description = "Thin gRPC service hosting BrainService; orchestration logic stays in cortex-core."
requires-python = ">=3.12"
dependencies = [
  "cortex-seam",
  # Floor tracks the committed gencode's import-time minimum; bump on every regen (ADR-0003).
  "grpcio>=1.81.1",
  "pydantic-settings>=2.6",
]

[tool.uv.sources]
cortex-seam = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_orchestrator"]
