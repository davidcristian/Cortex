[project]
name = "cortex-orchestrator"
version = "0.0.0"
description = "Thin gRPC service hosting BrainService; orchestration logic stays in cortex-core."
requires-python = ">=3.12"
dependencies = [
  "cortex-body-client",
  "cortex-core",
  "cortex-embedding",
  "cortex-inference",
  "cortex-memory",
  "cortex-model-manager",
  "cortex-seam",
  "cortex-session",
  "cortex-tools",
  # The minimum the committed generated code needs to import; raise it on every regeneration.
  "grpcio>=1.81.1",
  "httpx>=0.27",
  "pydantic>=2.11",
  "pydantic-settings>=2.6",
]

[tool.uv.sources]
cortex-body-client = { workspace = true }
cortex-core = { workspace = true }
cortex-embedding = { workspace = true }
cortex-inference = { workspace = true }
cortex-memory = { workspace = true }
cortex-model-manager = { workspace = true }
cortex-seam = { workspace = true }
cortex-session = { workspace = true }
cortex-tools = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_orchestrator"]
