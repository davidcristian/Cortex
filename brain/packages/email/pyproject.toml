[project]
name = "cortex-email"
version = "0.0.0"
description = "Read-only IMAP MCP server: list/search/read email over ProtonMail Bridge (ADR-0009)."
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.23,<2",
  "imap-tools>=1.7",
  "pydantic>=2.11",
  "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_email"]
