# Virtual workspace root for the Python brain (see AGENTS.md and docs/ROADMAP.md Slice 1).
# Not a package itself; real code lives in packages/*.

[project]
name = "brain"
version = "0.0.0"
requires-python = ">=3.12"
# The virtual root depends on every workspace member so `uv sync --locked` installs them all.
dependencies = [
  "cortex-core",
  "cortex-embedding",
  "cortex-inference",
  "cortex-orchestrator",
  "cortex-seam",
  "cortex-session",
]

[tool.uv.sources]
cortex-core = { workspace = true }
cortex-embedding = { workspace = true }
cortex-inference = { workspace = true }
cortex-orchestrator = { workspace = true }
cortex-seam = { workspace = true }
cortex-session = { workspace = true }

[dependency-groups]
dev = [
  "fakeredis>=2.26",
  "grpcio-tools>=1.66",
  "pyright>=1.1.400",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.11",
  "types-grpcio>=1.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["packages"]
# Generated wire code is exempt from quality gates (ADR-0001 d7, ADR-0002 d4); the
# committed .pyi stubs keep strict checking working for consumers of cortex_seam.
exclude = ["**/_generated"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["packages"]
markers = [
  "integration: exercises live external systems; excluded from coverage gate and CI",
]
addopts = "--cov --cov-branch --cov-fail-under=100 --cov-report=term-missing --strict-markers -m \"not integration\""
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["packages"]
# _generated: the generated-code marker dirs are coverage-exempt (ADR-0002 decision 4)
omit = ["*/tests/*", "*/_generated/*"]
