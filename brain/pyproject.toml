# Virtual workspace root for the Python brain (see AGENTS.md and docs/ROADMAP.md Slice 1).
# Not a package itself; real code lives in packages/*.

[project]
name = "brain"
version = "0.0.0"
requires-python = ">=3.12"
# The virtual root depends on every workspace member so `uv sync --locked` installs them all.
dependencies = [
  "cortex-body-client",
  "cortex-core",
  "cortex-email",
  "cortex-embedding",
  "cortex-inference",
  "cortex-memory",
  "cortex-model-manager",
  "cortex-orchestrator",
  "cortex-seam",
  "cortex-session",
  "cortex-tools",
]

[tool.uv.sources]
cortex-body-client = { workspace = true }
cortex-core = { workspace = true }
cortex-email = { workspace = true }
cortex-embedding = { workspace = true }
cortex-inference = { workspace = true }
cortex-memory = { workspace = true }
cortex-model-manager = { workspace = true }
cortex-orchestrator = { workspace = true }
cortex-seam = { workspace = true }
cortex-session = { workspace = true }
cortex-tools = { workspace = true }

[dependency-groups]
dev = [
  "asyncpg-stubs>=0.30",
  "fakeredis>=2.26",
  "grpcio-tools>=1.66",
  "pyright>=1.1.400",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "pytest-randomly>=4.1",
  "ruff>=0.11",
  "types-grpcio>=1.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["packages"]
# The same shared corpus directory the pytest `pythonpath` below names, so a bare
# `from recall_corpus import ...` resolves from any package's tests rather than only from the
# one the file happens to sit in.
extraPaths = ["packages/inference/tests"]
# Generated wire code is exempt from quality gates (ADR-0001 d7, ADR-0002 d4); the
# committed .pyi stubs keep strict checking working for consumers of cortex_seam.
exclude = ["**/_generated"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["packages"]
# `recall_corpus.py` is test-tree input data (the wide recall corpus) that live runs in more than
# one package import as a bare module. Until the turn-cost block driver it worked only because
# pytest prepends a collected test file's own directory, so it depended on collection order;
# naming the directory here makes the import deliberate rather than incidental.
pythonpath = ["packages/inference/tests"]
markers = [
  "integration: exercises live external systems; excluded from coverage gate and CI",
]
# `--randomly-seed` is FIXED, so the order is not the collection order and is still the same
# order twice (ADR-0002 shuffle addendum). The number is arbitrary and frozen: changing it
# reshuffles this suite for no reason, and it differs from the other three suites' seeds on
# purpose, so nobody reads four independent numbers as one value that has to agree.
# `just shuffle` is the deliberate sweep over other seeds; pytest prints the seed in its header,
# so a red run names the order it ran in.
addopts = "--cov --cov-branch --cov-fail-under=100 --cov-report=term-missing --strict-markers -m \"not integration\" --randomly-seed=9973"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["packages"]
# _generated: the generated-code marker dirs are coverage-exempt (ADR-0002 decision 4)
omit = ["*/tests/*", "*/_generated/*"]
