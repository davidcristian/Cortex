# The workspace root for the Python brain. It is not a package itself; the code is in packages/.

[project]
name = "brain"
version = "0.0.0"
requires-python = ">=3.12"
# The root depends on every workspace member so that `uv sync --locked` installs them all.
dependencies = [
  "cortex-body-client",
  "cortex-core",
  "cortex-email",
  "cortex-embedding",
  "cortex-inference",
  "cortex-memory",
  "cortex-model-manager",
  "cortex-orchestrator",
  "cortex-seam",
  "cortex-session",
  "cortex-tools",
]

[tool.uv.sources]
cortex-body-client = { workspace = true }
cortex-core = { workspace = true }
cortex-email = { workspace = true }
cortex-embedding = { workspace = true }
cortex-inference = { workspace = true }
cortex-memory = { workspace = true }
cortex-model-manager = { workspace = true }
cortex-orchestrator = { workspace = true }
cortex-seam = { workspace = true }
cortex-session = { workspace = true }
cortex-tools = { workspace = true }

[dependency-groups]
dev = [
  "asyncpg-stubs>=0.30",
  "fakeredis>=2.26",
  "grpcio-tools>=1.66",
  "pyright>=1.1.400",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "pytest-randomly>=4.1",
  "ruff>=0.11",
  "types-grpcio>=1.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["packages"]
# The same shared directory the pytest `pythonpath` below names, so `from recall_corpus import
# ...` resolves from any package's tests and not only from the one holding the file.
extraPaths = ["packages/inference/tests"]
# Generated wire code is not checked; the committed .pyi stubs keep strict checking working for
# anything importing `cortex_seam`.
exclude = ["**/_generated"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["packages"]
# `recall_corpus.py` is test input data that live runs in more than one package import as a bare
# module. Naming its directory here makes that import work regardless of collection order.
pythonpath = ["packages/inference/tests"]
markers = [
  "integration: exercises live external systems; excluded from coverage gate and CI",
]
# `--randomly-seed` is fixed, so the order is not the collection order and is the same twice. The
# number is arbitrary and deliberately unlike the other suites' seeds, so nobody reads the four as
# one value that has to agree. `just shuffle` is what runs the other orders.
addopts = "--cov --cov-branch --cov-fail-under=100 --cov-report=term-missing --strict-markers -m \"not integration\" --randomly-seed=9973"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["packages"]
# Generated code is not measured.
omit = ["*/tests/*", "*/_generated/*"]
