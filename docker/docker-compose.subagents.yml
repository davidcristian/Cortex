# Subagents override (Slice 7, ADR-0010; placement revised GPU-first by Slice 8.5, ADR-0012).
# Layer it ON TOP of the base file:
#     docker compose -f docker-compose.yml -f docker-compose.subagents.yml up
# It adds one CPU llama-server (the small subagent model) and flips the brain from
# subagents=none to the llamacpp backend. Subagent task state lives in the base file's Redis
# (the TaskStore). CI never runs this file. Subagents are opt-in so CI and the no-GPU dev
# loop stay subagent-free (AGENTS.md gate 3). The model this file wires is the roster's
# DEFAULT entry (the injection-robust pick, ADR-0017); docker-compose.subagents-roster.yml
# layers an alternate model the cortex can pick per subtask (ADR-0018).
#
# Placement is GPU-first with CPU overflow (ADR-0012): the brain fit-tests each spawn against
# the VRAM headroom (CORTEX_VRAM_SOFT_CAP_GB − CORTEX_VRAM_CORTEX_GB − placed) and routes it
# to the GPU or the CPU backend. The cgroup caps are at the bottom of this file, and the real
# GPU-placed executor now exists as an OPT-IN tier of the model-host supervisor sidecar
# (docker-compose.gpu.yml, behind CORTEX_MODEL_FILE_SUBAGENT_GPU, -ngl 99 on :8083). What is
# still CPU-only by DEFAULT is the routing: this file points BOTH endpoints at the one CPU
# server, so a GPU-placed subagent executes on CPU unless a deployment sets
# CORTEX_SUBAGENTS_GPU_ENDPOINT=http://model-host:8083 as well. It therefore needs NO GPU and
# runs alongside docker-compose.gpu.yml. To give subagents tools, ALSO layer
# the tools/email overrides. The wiring hands them the MCP subset without the spawn tool
# (depth-1):
#     docker compose -f docker-compose.yml -f docker-compose.tools.yml -f docker-compose.subagents.yml up
#
# Set on the host (a .env at the repo root works):
#   CORTEX_MODELS_DIR          host dir holding the GGUFs (default ./models, ADR-0004)
#   CORTEX_MODEL_FILE_SUBAGENT subagent GGUF path under that dir (the pick: gemma-4-E4B QAT q4_0
#                              is the injection-robust subagent, ADR-0004 pick-revision addendum;
#                              measured in docs/runbooks/subagents-cpu.md. Qwen3.5-2B Q4_K_M is
#                              the cheaper/faster override when robustness matters less)
#   CORTEX_SUBAGENTS_{CPUS,MEMORY_GB,VRAM_GB}    one subagent's resource ask (ADR-0012)
#   CORTEX_SUBAGENTS_{CPU_BUDGET,MEM_BUDGET_GB}  soft admission ceilings (sum of admitted asks)
#   CORTEX_SUBAGENTS_PARALLEL  server slots; keep ≈ CPU_BUDGET / CPUS (default 2)
#   CORTEX_SUBAGENTS_STALL_TIMEOUT_S  how long a delegated stream may send NOTHING before the
#                              spawn fails instead of holding its admission (ADR-0005
#                              stall-ceiling addendum). It bounds the gap between chunks, not
#                              the length of a generation. Left to the brain's own default here,
#                              which is sized for this CPU tier; docs/runbooks/subagents-cpu.md
#   CORTEX_SUBAGENTS_ADMISSION_WAIT_S  how long a spawn may QUEUE for room under the budgets
#                              below before it is refused instead of waiting for room forever
#                              (ADR-0012 bounded-admission-wait addendum). Also left to the
#                              brain's own default, an upper bound over both placements: twice
#                              the wait a full batch's last spawn takes while an entry's
#                              admitted pair serializes on one target, four times the wait it
#                              takes while that pair overlaps, which is what these budgets ship
#                              beside the VRAM ask below. Raising CPU_BUDGET or lowering CPUS
#                              shortens the real waits and never needs this raised; queuing two
#                              full batches at once needs it raised only where the GPU path is
#                              shut, the overlapping placement draining that queue inside the
#                              default and the serial one not
#   CORTEX_SUBAGENTS_MAX_TOKENS  how far any ONE completion of a delegated run may decode, and
#   CORTEX_SUBAGENTS_RUN_TIMEOUT_S  the deadline on the WHOLE run, its tool dispatches included
#                              (ADR-0005 total-cap addendum). The bound a stall ceiling cannot
#                              be: a subagent in a repetition loop is never silent, so it held
#                              its admission and its entry's lease for as long as it kept
#                              talking. Both left to the brain's own defaults here, measured on
#                              this file's CPU entry; the deadline must stay above the stall
#                              ceiling or the brain refuses to start, since a wedge reported as
#                              a runaway loses the CPU re-run it deserves, and under the
#                              admission wait above or it refuses to start for the other
#                              reason, a run holding its room for as long as a peer will queue
#                              for that room being a working pool that reads as a refusing one
#                              (a wait of zero queues nothing and is exempt)

services:
  brain:
    environment:
      # Opt into delegation; without this the base image runs subagents=none (ADR-0010).
      CORTEX_SUBAGENTS_BACKEND: "llamacpp"
      # In-network addresses of the llama-server(s) below (NOT the host-published port).
      # Both placement targets resolve to the one CPU server by default. The real GPU-placed
      # executor is the model-host sidecar's opt-in subagent tier, so a deployment that names
      # CORTEX_MODEL_FILE_SUBAGENT_GPU should set CORTEX_SUBAGENTS_GPU_ENDPOINT to
      # http://model-host:8083 in the same step, or the tier it started routes nothing.
      CORTEX_SUBAGENTS_ENDPOINT: "http://llama-subagent:8082"
      CORTEX_SUBAGENTS_GPU_ENDPOINT: "${CORTEX_SUBAGENTS_GPU_ENDPOINT:-http://llama-subagent:8082}"
      # Per-subagent ask + soft admission budgets (ADR-0012). The ask reflects the measured
      # E4B pick (ADR-0004 pick-revision addendum): ~2.5 GiB RSS on CPU -> 3.0 memory ask
      # (2 admitted under the 8 GB budget, matching --parallel). The VRAM ask is measured too
      # since 2026-08-08: the GPU-placed tier costs 3338 to 3410 MiB at the shape below
      # (-ngl 99, the ctx size and --parallel of this file), so 3.5 GiB sits about 174 MiB over
      # its peak and fits the 5.4 GiB headroom the 14 GB soft cap leaves beside the cortex. One
      # spawn is therefore GPU-placed and the next overflows to the CPU server, which is what one
      # tier process can serve. Every default on the five lines below is one of the brain's own
      # module constants (DEFAULT_VRAM_GB, DEFAULT_CPUS, DEFAULT_MEMORY_GB, DEFAULT_CPU_BUDGET and
      # DEFAULT_MEM_BUDGET_GB in config_subagents.py), and the constant scan
      # (scripts/crosscheck.py) holds every spelling of each in this file to its declaration, the
      # sentences above and the cgroup comment below included. So retuning one of them there and
      # not here fails a gate instead of leaving a deployment charging a number the brain does not.
      CORTEX_SUBAGENTS_CPUS: "${CORTEX_SUBAGENTS_CPUS:-2.0}"
      CORTEX_SUBAGENTS_MEMORY_GB: "${CORTEX_SUBAGENTS_MEMORY_GB:-3.0}"
      CORTEX_SUBAGENTS_VRAM_GB: "${CORTEX_SUBAGENTS_VRAM_GB:-3.5}"
      CORTEX_SUBAGENTS_CPU_BUDGET: "${CORTEX_SUBAGENTS_CPU_BUDGET:-4.0}"
      CORTEX_SUBAGENTS_MEM_BUDGET_GB: "${CORTEX_SUBAGENTS_MEM_BUDGET_GB:-8.0}"
      # No price line is needed here: the brain already charges one `spawn_subagents`
      # dispatch a quarter of a turn's tool budget (ADR-0009 cost addendum), so a turn may
      # delegate four times, each still a whole batch of instructions. To retune it, add
      #     CORTEX_TOOLS_COSTS__SPAWN_SUBAGENTS: "4"
      # here (1..32; outside that fails the brain at startup, by design). Note that any
      # CORTEX_TOOLS_COSTS__<name> key must be listed in this environment block to reach the
      # container, and that the brain merges its built-in prices under yours, so pricing one
      # tool never silently unprices another.
    depends_on:
      llama-subagent:
        condition: service_healthy

  llama-subagent:
    # CPU (non-CUDA) OpenAI-compatible llama.cpp server (ADR-0005). Pin to a digest on the host
    # once the subagent pick is locked. Mutable tags are a supply-chain risk (ADR-0006).
    image: "ghcr.io/ggml-org/llama.cpp:server"
    # A small (2-4B) subagent model on CPU. --jinja enables the tool-capable chat template so
    # tools-enabled subagents can function-call (ADR-0010); --parallel gives each admitted
    # subagent a server slot. Keep it ≈ CPU_BUDGET / CPUS, the scheduler's effective
    # concurrency under the ADR-0012 soft budget.
    command:
      - "--model"
      - "/models/${CORTEX_MODEL_FILE_SUBAGENT:-google/gemma-4-E4B-it-qat-q4_0-gguf/gemma-4-E4B_q4_0-it.gguf}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8082"
      # CPU only: this server is the default executor for BOTH placement targets. The GPU one
      # (-ngl 99) is the model-host sidecar's opt-in subagent tier, not a service here.
      - "-ngl"
      - "0"
      - "--jinja"
      # Disable reasoning for the subagent tier (ADR-0010 increment-4 addendum): both lineup
      # families (gemma-4-E*, Qwen3.5) are reasoning models, and unbounded thinking on CPU is
      # minutes/call. Narrow subagents don't need it. This is the server-side twin of
      # enable_thinking=false; templates honor it (validated on the E4B pick: '17 + 25' answers
      # '42' in ~1.8 s with no reasoning trace; on the Qwen-2B override, ~0.3-0.6 s). The E4B
      # injection-robustness holds with thinking OFF (0/10, ADR-0004 injection addendum).
      - "--chat-template-kwargs"
      - '{"enable_thinking": false}'
      - "--ctx-size"
      - "${CORTEX_SUBAGENT_CTX_SIZE:-8192}"
      - "--parallel"
      - "${CORTEX_SUBAGENTS_PARALLEL:-2}"
    volumes:
      # Models stay on the Windows drive, mounted read-only (ADR-0004 d3).
      - type: bind
        source: "${CORTEX_MODELS_DIR:-./models}"
        target: /models
        read_only: true
    ports:
      # Loopback-only publish so host-side integration tests can reach it (assumption 5);
      # the brain uses the in-network address above, not this one.
      - "127.0.0.1:8082:8082"
    restart: unless-stopped
    healthcheck:
      # llama-server serves /health once the model finishes loading; a smaller CPU model
      # loads faster than the cortex, so a shorter start_period than the GPU file suffices.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
      start_interval: 2s
    # ADR-0012's per-container caps for the CPU half (the GPU half lives in the model-host
    # container now, ADR-0030 decision 3, where one cap set covers all three of its tiers). The defaults are the hard twin of the brain's SOFT
    # admission budgets above (CPU_BUDGET 4.0, MEM_BUDGET_GB 8.0), which is what makes those
    # budgets more than an honour system: the scheduler stops admitting at the soft sum, and the
    # cgroup is what happens if anything ever admits past it. Both pairs are the constant scan's,
    # which reads the brain's own DEFAULT_CPU_BUDGET and DEFAULT_MEM_BUDGET_GB and holds every
    # spelling of each in this file to that number. The cpus limit takes its budget as the brain
    # writes it, docker's cpus field being a float; the two memory
    # limits below take theirs without its point because docker parses 8g as a size and refuses
    # 8.0g. memswap == memory disables swap for the container, the "--memory-swap" half of that
    # deferral: a subagent that swapped would take minutes per token and look like a hang.
    cpus: "${CORTEX_SUBAGENTS_CPU_BUDGET:-4.0}"
    mem_limit: "${CORTEX_SUBAGENTS_MEM_BUDGET_GB:-8}g"
    memswap_limit: "${CORTEX_SUBAGENTS_MEM_BUDGET_GB:-8}g"
