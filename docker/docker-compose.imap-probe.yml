# The IMAP probe: a second IMAP server, run locally so that both of the things a refused
# SELECT can mean have a real server saying them. Start it with `just up-imap-probe` and
# measure with `just email-folder-probe`; procedure and the measured answers are in
# docs/runbooks/email-imap.md.
#
# Why it exists. `ImapMailbox` types a refused SELECT as a folder no mailbox has only when the
# server's own answer says so, because the same NO also covers a mailbox that is really there
# and cannot be opened. Against the ProtonMail Bridge this repo talks to, the second case
# cannot be produced at all: every wrong name is refused in the same words and every listed
# folder opens. Dovecot with its ACL plugin says both, so the rule is measured against two
# servers that disagree about wording rather than inferred from one that only ever says one
# thing (ADR-0022 two-server addendum).
#
# It is NOT part of the brain stack: its own project name, its own network, no `depends_on`
# anywhere, and nothing in the compose stack points at it. It holds no mail (the store is a
# tmpfs, so every start is empty), it checks no password (docker/dovecot/probe.conf), and it
# publishes on loopback only. Take it down with `just down-imap-probe` when the measurement is
# over; it is a fixture, not a service, so it does not restart itself.

name: cortex-imap-probe

# The probe's mail root, written here and read everywhere else. The store below, the tree the
# entrypoint builds and the home dovecot resolves are one path, and this file used to spell it
# once while docker/dovecot/probe-mailboxes.sh spelled it twice and docker/dovecot/probe.conf
# twice more. Moving the conf alone left dovecot resolving a home nothing built, which is loud;
# moving this one alone left the store working and no longer throwaway, which is not. So it is
# an anchor, aliased into the tmpfs and into the environment the other two files read it from.
x-mail-root: &mail-root "/srv/mail"

# The probe's configuration directory, which is dovecot's own and not a path this file may
# choose: the image declares a volume there, so a container with nothing mounted at it gets an
# anonymous volume docker fills with the image's copy and `down` leaves on the host under a name
# nobody picked. A tmpfs gives docker nothing to fill. The configuration is bound in beside the
# entrypoint and copied onto that mount rather than bound straight at the path dovecot reads,
# which is what keeps this spelling honest: dovecot's compiled-in default is /etc/dovecot and
# nothing here can move it, so a root written as anything else is a server reading the image's
# own configuration and a suite that goes red, not a fixture quietly leaking a volume again.
x-config-root: &config-root "/etc/dovecot"

services:
  imap-probe:
    # Pinned: the whole value of this stack is that the wording it produces was recorded
    # against a named server build, so the version is part of the measurement.
    image: "dovecot/dovecot:2.3.21"
    # The mailbox tree has to exist before anything connects, and this image's own entrypoint
    # goes straight to the server, so the bootstrap script is the entrypoint and becomes the
    # server itself. `init` restores the reaping the image's tini was doing.
    entrypoint: ["/bin/sh", "/probe-mailboxes.sh"]
    init: true
    environment:
      # The mail root above, handed to the two files that need it. The entrypoint reads it
      # directly, and `set -u` stops the container if it ever arrives unset; dovecot reads it
      # with `%{env:...}`, which needs the name listed on `import_environment` in probe.conf
      # to reach the processes that expand it.
      CORTEX_IMAP_PROBE_MAIL_ROOT: *mail-root
      # The configuration directory above, handed to the entrypoint, which checks it is really
      # the tmpfs this file mounts and then writes the configuration onto it.
      CORTEX_IMAP_PROBE_CONFIG_ROOT: *config-root
    volumes:
      # The whole configuration, replacing the image's own (which has no ACL plugin and so
      # cannot produce the refusal this exists for). It is mounted beside the entrypoint rather
      # than at the path dovecot reads, because that path is inside the tmpfs above and the
      # entrypoint puts it there; the image's `cert.pem` and `key.pem` are symlinks in that same
      # directory, so the configuration points at the files they name instead.
      - type: bind
        source: ./docker/dovecot/probe.conf
        target: /probe.conf
        read_only: true
      - type: bind
        source: ./docker/dovecot/probe-mailboxes.sh
        target: /probe-mailboxes.sh
        read_only: true
    tmpfs:
      # The mail store, deliberately not a volume: a fixture that starts empty every time
      # cannot drift from the script that builds it, and `down` leaves nothing behind. The
      # entrypoint checks that this mount is really here before it builds anything, so a store
      # that stopped being throwaway is a container that will not start rather than a fixture
      # quietly keeping what the last run left.
      - *mail-root
      # The configuration directory, mounted for a different reason: not to keep the container
      # from writing anything durable, but to leave docker's own volume declaration nothing to
      # anonymise. The entrypoint checks this one too, because a tmpfs that went missing here is
      # a fixture that still measures correctly and leaves a volume behind every run.
      - *config-root
    ports:
      # Loopback-only publish so a host-side measurement can reach it. Nothing else may. Whose
      # loopback it lands on is the engine's business rather than this file's: a Docker Desktop
      # engine publishes onto the Windows host, so the WSL distro beside it reaches this container
      # on the bridge and never here, which is why `just email-folder-probe` asks docker where the
      # server answers instead of assuming this line.
      - "127.0.0.1:11143:143"
    healthcheck:
      test: ["CMD", "doveadm", "service", "status"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
