
name: cortex-imap-probe

x-mail-root: &mail-root "/srv/mail"

services:
  imap-probe:
    # Pinned: the whole value of this stack is that the wording it produces was recorded
    # against a named server build, so the version is part of the measurement.
    image: "dovecot/dovecot:2.3.21"
    # The mailbox tree has to exist before anything connects, and this image's own entrypoint
    # goes straight to the server, so the bootstrap script is the entrypoint and becomes the
    # server itself. `init` restores the reaping the image's tini was doing.
    entrypoint: ["/bin/sh", "/probe-mailboxes.sh"]
    init: true
    environment:
      CORTEX_IMAP_PROBE_MAIL_ROOT: *mail-root
    volumes:
      # The whole configuration, replacing the image's own (which has no ACL plugin and so
      # cannot produce the refusal this exists for). Only the file is mounted, so the
      # self-signed cert and key beside it in the image stay where they are.
      - type: bind
        source: ./docker/dovecot/probe.conf
        target: /etc/dovecot/dovecot.conf
        read_only: true
      - type: bind
        source: ./docker/dovecot/probe-mailboxes.sh
        target: /probe-mailboxes.sh
        read_only: true
    tmpfs:
      - *mail-root
    ports:
      - "127.0.0.1:11143:143"
    healthcheck:
      test: ["CMD", "doveadm", "service", "status"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
