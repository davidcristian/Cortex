# A second, local IMAP server used as a test fixture, so that both things a refused SELECT can mean
# have a real server saying them. It is no part of the brain stack. Start it with
# `just up-imap-probe` and measure with `just email-folder-probe`; docs/runbooks/email-imap.md.

name: cortex-imap-probe

# The probe's mail root, written once here and handed to the entrypoint and to dovecot in the
# environment below, so the tmpfs, the tree the entrypoint builds and the home dovecot resolves
# are one path.
x-mail-root: &mail-root "/srv/mail"

# The probe's configuration directory, which is dovecot's compiled-in path and not a choice this
# file may make. The tmpfs below leaves the volume the image declares there nothing to fill, and
# the entrypoint copies the configuration onto it.
x-config-root: &config-root "/etc/dovecot"

services:
  imap-probe:
    # A fixed version, because the wording this server produces was recorded against this build.
    image: "dovecot/dovecot:2.3.21"
    # The mailbox tree must exist before anything connects, so the setup script is the entrypoint
    # and becomes the server itself. `init` restores the reaping the image's tini was doing.
    entrypoint: ["/bin/sh", "/probe-mailboxes.sh"]
    init: true
    environment:
      # The mail root above. The entrypoint reads it directly; dovecot reads it with `%{env:...}`,
      # which needs the name listed on `import_environment` in probe.conf to reach the processes
      # that expand it.
      CORTEX_IMAP_PROBE_MAIL_ROOT: *mail-root
      # The configuration directory above. The entrypoint checks it is really the tmpfs this file
      # mounts, and then writes the configuration onto it.
      CORTEX_IMAP_PROBE_CONFIG_ROOT: *config-root
    volumes:
      # The whole configuration, replacing the image's own, which has no ACL plugin. It is mounted
      # beside the entrypoint rather than at the path dovecot reads, because that path is inside
      # the tmpfs above and the entrypoint puts it there.
      - type: bind
        source: ./docker/dovecot/probe.conf
        target: /probe.conf
        read_only: true
      - type: bind
        source: ./docker/dovecot/probe-mailboxes.sh
        target: /probe-mailboxes.sh
        read_only: true
    tmpfs:
      # The mail store, deliberately a tmpfs and not a volume: a fixture that starts empty every
      # time cannot differ from the script that builds it, and `down` leaves nothing behind.
      - *mail-root
      # The configuration directory, mounted to leave the volume the image declares there nothing
      # to fill. The entrypoint checks this one too.
      - *config-root
    ports:
      # Published on loopback so a host-side measurement can reach it, and nothing else may. Which
      # loopback that is depends on the engine, which is why `just email-folder-probe` asks docker
      # where the server listens rather than assuming this line.
      - "127.0.0.1:11143:143"
    healthcheck:
      test: ["CMD", "doveadm", "service", "status"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
