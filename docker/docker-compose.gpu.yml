# GPU override for the brain (the ADR-0005 engine, ADR-0007 wiring, ADR-0030 process lifecycle).
# Layer it ON TOP of the base file:
#     docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
# It adds the `model-host` supervisor sidecar, which runs one llama-server child per logical model
# (the resident cortex on :8080, and, when a deployment names artifacts for them, the deep model on
# :8081 and a GPU-placed subagent tier on :8083), and flips the brain from the Echo fake to the real
# llama.cpp adapter pointed at that container. CI never runs this file, since CI is GPU-less by
# design (AGENTS.md gate 3). Everything marked "validate on host" is measured/finalized in
# docs/runbooks/llamacpp-gpu.md and ADR-0004 (final model picks).
#
# The sidecar replaces the always-on `llama-cortex` service it grew out of (ADR-0030 decision 3): a
# swap has to be able to stop the cortex and start the deep model, and nothing in a compose service
# can do that. A stack that never escalates behaves as the old one did, because the daemon starts
# the cortex at boot with argv copied flag for flag from that service's `command`
# (docs/modules/brain-model-manager.md).
#
# Set these on the host (a .env at the repo root works):
#   CORTEX_MODELS_DIR      host dir holding the GGUFs (default ./models, ADR-0004)
#   CORTEX_MODEL_FILE_CORTEX  cortex GGUF path under that dir (default: the gemma-4-12B pick)
#   CORTEX_MODELHOST_{CPUS,MEMORY,MEMSWAP}  the container's cgroup caps (ADR-0012 host half).
#                          Placeholders: the maintainer measures real numbers on the 24 GB machine.
#
# To turn the brain handoff on (off by default; the deep-model pick is gemma-4-31B QAT q4_0,
# measured 2026-08-04, ADR-0004), a deployment additionally sets, in the `brain` environment below:
#   CORTEX_ESCALATION=1, CORTEX_MODELHOST_BACKEND=supervisor,
#   CORTEX_BRAIN_ENDPOINT=http://model-host:8081
# and, in the `model-host` environment, CORTEX_MODEL_FILE_BRAIN (plus CORTEX_NGL_BRAIN /
# CORTEX_CTX_SIZE_BRAIN to fit it). A tier with no artifact file is not in the roster at all, so
# without that file the deep model answers 404 rather than spawning a doomed process.
# Procedure and failure modes: docs/runbooks/model-swap.md.
#
# The GPU-placed SUBAGENT tier is opt-in the same way, and takes three settings together, not one:
#   CORTEX_MODEL_FILE_SUBAGENT_GPU   puts the tier in this sidecar's roster (-ngl 99 on :8083)
#   CORTEX_SUBAGENTS_GPU_ENDPOINT=http://model-host:8083   routes GPU-placed spawns to it. The
#                          subagents override defaults this to the CPU server, so WITHOUT this
#                          line the tier runs and nothing reaches it.
#   CORTEX_SWAP_EVICT_MODELS   lists it so a handoff stops it first (the deep model runs alone).
#
# That last line is reversible, on a card that has been measured to hold the pair: setting
# CORTEX_SWAP_CORESIDENT=1 in the `brain` environment leaves every listed tier serving through the
# handoff and skips the subagent pool's drain entirely, so delegation keeps flowing and the deep
# phase may spawn. It is OFF by default, and turning it on also requires
# CORTEX_SWAP_BRAIN_VRAM_MIB, the deep tier's measured VRAM cost (19125 MiB for the pick below):
# the sidecar reports what the card has free on GET /health and the swap refuses the handoff when
# that figure will not clear, which is the only check there is, since the brain container itself
# sees no GPU. On this stack's own 24 GB card the deep model and the E4B subagent tier fit together at
# 23555 to 23642 MiB with about 908 MiB free, while the cortex and the deep model do not fit and
# do not say so: WSL2 pages the overcommit and halves the deep model's decode rate with nvidia-smi
# reading the same ~23.6 GB used. Measure decode, not memory, which the brain now does for itself:
# CORTEX_SWAP_BRAIN_DECODE_TPS names the tokens per second the deep tier reaches when the card
# really holds it (measure it from a cold load of that tier alone), and a deep phase that never
# clears it logs a warning naming both numbers. Unset, the rate is logged and judged against
# nothing. Procedure, the measured spilled-against-healthy numbers, and the table:
# docs/runbooks/model-swap.md.

services:
  brain:
    environment:
      # Opt into the real adapter; without this the base image runs Echo (ADR-0007 d4).
      CORTEX_INFERENCE_BACKEND: "llamacpp"
      # In-network addresses of the supervised children and of the control API (NOT the
      # host-published ports). The cortex tier is a child process now, not a service.
      CORTEX_INFERENCE_ENDPOINT: "http://model-host:8080"
      # CORTEX_INFERENCE_STALL_TIMEOUT_S bounds how long a stream from that endpoint (or from the
      # deep tier after a handoff) may send NOTHING before the turn fails, the gap between chunks
      # rather than the length of a generation (ADR-0005 stall-ceiling addendum). Left to the
      # brain's own default, which is sized from this card's measured time to first token; a
      # slower card raises it. See docs/runbooks/llamacpp-gpu.md.
      # Where the ModelHost adapter sends a start/stop/status. Harmless while escalation is off
      # (nothing builds the adapter), and required the moment CORTEX_MODELHOST_BACKEND=supervisor.
      CORTEX_MODELHOST_ENDPOINT: "http://model-host:9300"
    depends_on:
      model-host:
        condition: service_healthy

  model-host:
    # Built from the uv workspace onto llama.cpp's CUDA server image: it needs the Python daemon
    # and the llama-server binary in ONE image, and no existing image has both (brain/Dockerfile
    # .modelhost says why the obvious shortcut does not work).
    # The context is relative to the project directory (always the repo root, `--project-directory
    # .`), which is why it reads ./brain and not ../brain: the same form the email sidecar uses.
    build:
      context: ./brain
      dockerfile: Dockerfile.modelhost
    image: "cortex-model-host"
    init: true
    environment:
      # The control API's bind address: the compose network reaches it by service name.
      CORTEX_MODELHOST_BIND_HOST: "0.0.0.0"
      CORTEX_MODELHOST_BIND_PORT: "9300"
      # The resident cortex model: gemma-4-12B (QAT Q4, ADR-0004 addendum pick). -ngl 99 = all
      # on GPU, and an explicit --ctx-size because llama.cpp's own default (262144)
      # pre-allocates a KV cache that blows the VRAM envelope.
      # CORTEX_MMPROJ_FILE_CORTEX names the multimodal projector that gives the cortex eyes
      # (ADR-0029): setting it adds llama.cpp's --mmproj pair to this tier's argv, and the brain
      # then discovers vision from the running server's /props rather than from a second flag it
      # could disagree with. Empty starts the tier text-only. The projector ships beside the
      # model under the same read-only mount, so no extra bind is needed.
      CORTEX_MODEL_FILE_CORTEX: "${CORTEX_MODEL_FILE_CORTEX:-google/gemma-4-12B-it-qat-q4_0-gguf/gemma-4-12b-it-qat-q4_0.gguf}"
      CORTEX_MMPROJ_FILE_CORTEX: "${CORTEX_MMPROJ_FILE_CORTEX:-}"
      # How many tokens one picture may occupy, and with it how much of a 4K screen survives the
      # downscale. 1024 is the default, together with CORTEX_BODY_CAPTURE_MAX_EDGE=2048 on the
      # brain: the pair took a 4K corpus from 13% of ground-truth strings read to 79%, and it is
      # paid for in about 400 MiB of VRAM, 0.6 s of latency and 744 context tokens a capture. Set
      # it to 0 to hand the budget back to the model, which is the 266-token view that reads 13%;
      # the measurement, the costs and the failure boundary the pair still leaves are in
      # docs/runbooks/llamacpp-gpu.md. Ignored without a projector. Never set llama.cpp's
      # --image-max-tokens by hand instead: a budget over 512 with the default micro-batch aborts
      # the server on the first oversized picture, and this knob emits the matching --ubatch-size
      # for exactly that reason.
      CORTEX_IMAGE_MAX_TOKENS: "${CORTEX_IMAGE_MAX_TOKENS:-1024}"
      CORTEX_NGL: "${CORTEX_NGL:-99}"
      CORTEX_CTX_SIZE: "${CORTEX_CTX_SIZE:-16384}"
      # How many tokens a tier may spend thinking before the engine closes the thought and makes
      # it answer. This is the middle of a dial the brain only had the ends of: a request says
      # whether to think at all (CORTEX_REPLY_THINKING, and the bounds the recap fold, the session
      # title and the recall rank already send), and this says how long a think that does happen
      # may be. -1, the default, emits no flag and leaves the trace unbounded exactly as before;
      # 0 ends thinking immediately for every request this tier serves; N > 0 lets it think that
      # far and then answer. Measured on the cortex pick, one open question per arm: unrestricted
      # spends 2323 to 2996 characters of trace and 10.1 to 12.6 s before the first word, 512
      # spends about 2000 and 8.4 to 9.2 s, 128 spends about 500 and 1.7 to 2.6 s, and 0 spends
      # none and 0.2 s, with the reply itself the same size in every arm. Setting this is also
      # what makes the brain's own CORTEX_REPLY_MAX_TOKENS usable with thinking left on: a cap of
      # 512 returned an EMPTY reply 3 of 3 against an unbounded trace and a full one under a
      # budget of 128. The engine has to support it: llama.cpp reads N > 0 as a token budget, and
      # a build that does not know the flag at all fails the tier at startup rather than ignoring
      # it, which is why the default emits nothing. See docs/runbooks/llamacpp-gpu.md.
      CORTEX_REASONING_BUDGET: "${CORTEX_REASONING_BUDGET:--1}"
      # The logical ids, which must match the brain's own (the endpoint map is static config on
      # both sides, since no port carries a path, a layer count, or a URL).
      CORTEX_MODEL_CORTEX: "${CORTEX_MODEL_CORTEX:-cortex}"
      CORTEX_MODEL_BRAIN: "${CORTEX_MODEL_BRAIN:-brain}"
      # A tier is in the roster only when a file is named for it, so these stay empty by default:
      # the deep tier is opt-in (escalation is off unless a deployment turns it on), and so is the
      # GPU-placed subagent tier. Empty is not "undecided" here any more. The deep-model pick is
      # google/gemma-4-31B-it-qat-q4_0-gguf/gemma-4-31B_q4_0-it.gguf, measured 2026-08-04 on a card
      # that holds the tiers: 19128 MiB with the cortex evicted at the 8192 context below, 99.6 s
      # from start to READY off the mount, and the only candidate of the four to answer every
      # escalation-grade question inside a bounded budget (ADR-0004's brain-pick addendum, which
      # also records Qwen3.6-27B Q4_K_M as the 2.7 GB lighter alternate). Name it here or in a
      # .env to put the tier in the roster; nothing else does.
      CORTEX_MODEL_FILE_BRAIN: "${CORTEX_MODEL_FILE_BRAIN:-}"
      CORTEX_NGL_BRAIN: "${CORTEX_NGL_BRAIN:-99}"
      CORTEX_CTX_SIZE_BRAIN: "${CORTEX_CTX_SIZE_BRAIN:-8192}"
      # The deep tier's own thinking budget, in the same vocabulary and defaulting the same way.
      # It is separate from the cortex's because the two are read on opposite arguments: the
      # cortex answers while somebody watches, and this tier was picked for reaching an answer
      # inside its trace at all, so shortening one is no reason to shorten the other.
      CORTEX_REASONING_BUDGET_BRAIN: "${CORTEX_REASONING_BUDGET_BRAIN:--1}"
      CORTEX_MODEL_FILE_SUBAGENT_GPU: "${CORTEX_MODEL_FILE_SUBAGENT_GPU:-}"
      CORTEX_SUBAGENT_CTX_SIZE: "${CORTEX_SUBAGENT_CTX_SIZE:-8192}"
      CORTEX_SUBAGENTS_PARALLEL: "${CORTEX_SUBAGENTS_PARALLEL:-2}"
      # How long a child gets on SIGTERM before it is killed, and how long a killed one gets to be
      # reaped. `stop` does not answer until the child is gone, because a swap starts the next
      # model immediately after. Keep the sum of these two AND the probe timeout (5 s, which a
      # status queued on the same per-model lock can add to a stop) BELOW the brain's
      # CORTEX_MODELHOST_TIMEOUT_S (60 s), or a slow-but-correct eviction reads as a dead sidecar.
      # GET /health reports all three, and the brain reads them at boot and refuses to serve when
      # its own deadline does not clear the sum, so breaking this rule now fails the stack up
      # front instead of one handoff later. The grace is not slack: measured, an idle
      # llama-server exits in ~0.14 s but one with a request in flight ignores SIGTERM and is
      # killed after the full grace, so this is what evicting a busy tier really costs.
      # Spelled with the point the sidecar's own constants carry, so the substitution default and
      # the declaration are one text and the cross-tree scan can compare them (ADR-0029).
      CORTEX_MODELHOST_STOP_GRACE_S: "${CORTEX_MODELHOST_STOP_GRACE_S:-10.0}"
      CORTEX_MODELHOST_REAP_TIMEOUT_S: "${CORTEX_MODELHOST_REAP_TIMEOUT_S:-30.0}"
      CORTEX_MODELHOST_PROBE_TIMEOUT_S: "${CORTEX_MODELHOST_PROBE_TIMEOUT_S:-5.0}"
      # What GET /health reads the card with, so the brain can refuse a handoff that will not fit.
      # The container toolkit injects this binary alongside the driver, so the default is right
      # wherever a GPU is reserved; where none is, it is simply absent and the daemon reports no
      # reading, which is what a brain with no measured figure never asks about anyway. Bounded by
      # the probe timeout above, both being control-plane reads a swap step waits on.
      CORTEX_MODELHOST_NVIDIA_SMI: "${CORTEX_MODELHOST_NVIDIA_SMI:-nvidia-smi}"
      # The sidecar's half of the brain's CORTEX_LOG_FORMAT, under its own prefix because this
      # container's env is its own. 'plain' appends each lifecycle line's tier, pid and port after
      # the message; 'packed' writes the whole record as one JSON object.
      CORTEX_MODELHOST_LOG_FORMAT: "${CORTEX_MODELHOST_LOG_FORMAT:-plain}"
    volumes:
      # Models stay on the Windows drive, mounted read-only (ADR-0004 d3). Forward slashes
      # work in Docker Desktop on Windows; override the source with CORTEX_MODELS_DIR.
      - type: bind
        source: "${CORTEX_MODELS_DIR:-./models}"
        target: /models
        read_only: true
    ports:
      # The cortex tier's own port, loopback-only, exactly as the service it replaces published it,
      # so `just brain-inference-live` and docs/runbooks/llamacpp-gpu.md keep working unchanged.
      #
      # Deliberately NOT published: the control API (:9300) and the other tiers' ports. The control
      # API can start and stop processes on the container that holds the GPU and the models mount,
      # and ADR-0030 decision 3 says it is reachable only on the compose network; on WSL2 a
      # 127.0.0.1 publish is also reachable from Windows' own localhost, which is a wider door than
      # this API should have. The other tiers' container ports collide with existing loopback
      # publishes anyway (:8081 is llama-embed, :8083 is llama-subagent-qwen). Host-side access for
      # a live test is the opt-in docker-compose.modelhost-loopback.yml override.
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    # The graceful shutdown sweep stops every child before the daemon exits, one tier at a time, so
    # size this by the sum and not by one stop: a child with a request in flight pays the whole
    # SIGTERM grace (measured 10.09 s, it does not honour the signal), and the roster holds up to
    # three tiers, so 3 x 10 s plus slack. Docker's default 10 s would cut the first tier short.
    # A child that survives even SIGKILL is deliberately outside this: the runtime then kills the
    # container, which takes its children with it (measured), so nothing leaks either way and this
    # only buys the clean path.
    stop_grace_period: 45s
    healthcheck:
      # Deliberately not just "the daemon answers": it asserts a model that can serve a turn is
      # READY, which is what the llama-cortex healthcheck meant and what `brain`'s depends_on
      # needs. A control API that answers while the cortex is still loading would let the brain
      # serve a turn that fails at the backend.
      #
      # "The cortex tier OR the deep tier", not the cortex alone, because a handoff deliberately
      # stops the cortex: with the cortex alone in the predicate a WORKING escalation marked this
      # container unhealthy for as long as it ran, and the runbook then read that as "the model is
      # not serving" and had the operator start the cortex onto a GPU the deep model was already
      # resident on. At cold boot the daemon starts only the cortex, so depends_on still gates on
      # exactly what it gated on before. The second curl drops -S because a stock deployment names
      # no deep artifact, so that tier is a 404 by design and its noise is not a diagnosis.
      # The generous start_period covers loading a multi-GB GGUF off the bind mount.
      test:
        - "CMD-SHELL"
        - 'curl -fsS http://127.0.0.1:9300/models/${CORTEX_MODEL_CORTEX:-cortex} | grep -q ''"state":"ready"'' || curl -fs http://127.0.0.1:9300/models/${CORTEX_MODEL_BRAIN:-brain} | grep -q ''"state":"ready"'''
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s
      start_interval: 2s
    # ADR-0012's per-container caps, landing here rather than on two llama-server sidecars because
    # ADR-0030 collapsed the GPU one into this container. The consequence is deliberate and
    # recorded: the cortex, the deep model, and the GPU subagent are PROCESSES in one cgroup, so
    # these cap all three collectively and no per-model CPU or RAM cap exists. Values are
    # placeholders the maintainer measures (the 8 GB dev GPU cannot hold a real tier pair). Note the
    # hazard: llama.cpp mmaps the GGUF, so mapped model pages count against the memory cap, and a
    # cap below the artifact size makes a load thrash rather than fail. memswap == memory disables
    # swap for the container, which is the "--memory-swap" half of that deferral.
    cpus: "${CORTEX_MODELHOST_CPUS:-8.0}"
    mem_limit: "${CORTEX_MODELHOST_MEMORY:-24g}"
    memswap_limit: "${CORTEX_MODELHOST_MEMSWAP:-24g}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
