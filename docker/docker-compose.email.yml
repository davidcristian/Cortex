
services:
  brain:
    environment:
      # Opt into tools, pointed at the email sidecar (ADR-0009). No allowlist needed:
      # the server is ours and read-only by construction (only the three read tools exist).
      CORTEX_TOOLS_BACKEND: "mcp"
      CORTEX_TOOLS_ENDPOINTS__EMAIL: "http://mcp-email:9100/mcp"
    depends_on:
      mcp-email:
        condition: service_started

  mcp-email:
    # The read-only IMAP MCP server ships in the brain image (cortex_email workspace member).
    build: ./brain
    command: ["python", "-m", "cortex_email"]
    environment:
      CORTEX_EMAIL_IMAP_HOST: "host.docker.internal"
      CORTEX_EMAIL_IMAP_PORT: "1143"
      CORTEX_EMAIL_IMAP_SECURITY: "starttls"
      CORTEX_EMAIL_IMAP_USER: "${CORTEX_EMAIL_IMAP_USER:?set the Bridge username}"
      CORTEX_EMAIL_IMAP_PASSWORD: "${CORTEX_EMAIL_IMAP_PASSWORD:?set the Bridge password}"
      CORTEX_EMAIL_IMAP_TLS_INSECURE: "${CORTEX_EMAIL_IMAP_TLS_INSECURE:-false}"
      CORTEX_EMAIL_IMAP_CA_CERT: "${CORTEX_EMAIL_IMAP_CA_CERT:-}"
    # Reach the Windows-host Bridge; host.docker.internal is automatic on Docker Desktop,
    # host-gateway is the portable fallback (ROADMAP assumption 3).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Loopback-only publish so a host-side integration test can reach it (assumption 5).
      - "127.0.0.1:9100:9100"
    init: true
    restart: unless-stopped
