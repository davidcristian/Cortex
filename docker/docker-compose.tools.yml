# Tools override (Slice 6, ADR-0009). Layer it ON TOP of the base file:
#     docker compose -f docker-compose.yml -f docker-compose.tools.yml up
# It adds a filesystem MCP server as a sidecar reached over streamable-http, and flips the
# brain from tools=none to the mcp backend pointed at it. CI never runs this file. Tools are
# opt-in so CI and the no-GPU dev loop stay MCP-free.
#
# Layer docker-compose.email.yml on top as well and BOTH tool families are live at once:
# each override contributes its own CORTEX_TOOLS_ENDPOINTS__<name> key (compose merges the
# environment maps key-wise) and the brain aggregates the sidecars behind one registry
# (ADR-0009 refinements addendum).
#
# Set on the host (a .env at the repo root works):
#   CORTEX_TOOLS_ROOT  host dir the filesystem tool may read (default ./sandbox), mounted RO
#
# Isolation (ADR-0009, fork 2): the server runs in its OWN container with a READ-ONLY bind
# mount scoped to /projects, and is pinned to a patched @modelcontextprotocol/server-filesystem
# (the EscapeRoute sandbox-escape CVEs, CVE-2025-53109/53110). Even a path-escape bug is
# bounded by the read-only, single-directory mount; every dispatched call is audit-logged.

services:
  brain:
    environment:
      # Opt into tools; without this the base image runs tools=none (ADR-0009).
      CORTEX_TOOLS_BACKEND: "mcp"
      CORTEX_TOOLS_ENDPOINTS__FILESYSTEM: "http://mcp-filesystem:9000/mcp"
      # The reference server also advertises write tools the read-only mount can only
      # EROFS-block; advertise just the read subset (refinements addendum, which is a UX nicety
      # plus defense in depth; the read-only mount below stays the security boundary).
      CORTEX_TOOLS_ALLOW__FILESYSTEM: >-
        ["read_file", "read_text_file", "read_media_file", "read_multiple_files",
        "list_directory", "list_directory_with_sizes", "directory_tree",
        "search_files", "get_file_info", "list_allowed_directories"]
    depends_on:
      mcp-filesystem:
        condition: service_started

  mcp-filesystem:
    # supergateway bridges the stdio reference filesystem server to streamable-http; the
    # server is confined to /projects (the read-only mount below). Both npm packages are
    # version-pinned: the filesystem server past the EscapeRoute fixes (CVE-2025-53109/53110,
    # patched in 2025.7.1) and the bridge for determinism. Bump deliberately, never float.
    #
    # Two things this command does that the obvious `npx ... --stdio "npx ..."` did not, both
    # measured 2026-08-08 (docs/runbooks/tools-mcp.md holds the numbers):
    #  1. Both packages are installed once at container start and invoked as binaries. The
    #     bridge spawns the stdio server per MCP session, and an `npx` spawn costs about 530 ms
    #     against about 107 ms for the installed binary, nearly all of it npx resolving the
    #     pinned package again. It is paid on the brain's critical path, so it is worth a
    #     slower container boot (which the brain tolerates: a sidecar down at boot is dialed
    #     on first use, per the ADR-0009 boot-tolerance addendum).
    #  2. `--stateful` binds one stdio child to one MCP session rather than to one JSON-RPC
    #     request. Stateless mode spawned a child per request and never reaped it: a few
    #     hundred tool calls left 1452 live server processes holding 20.5 GiB. Stateful kills
    #     the child when the client ends its session, and `--sessionTimeout` reaps a session
    #     abandoned without that goodbye.
    image: "node:22-bookworm-slim"
    command:
      - "sh"
      - "-c"
      - >-
        npm install -g --no-fund --no-audit
        supergateway@3.4.3 @modelcontextprotocol/server-filesystem@2026.1.14
        && exec supergateway --outputTransport streamableHttp --port 9000
        --stateful --sessionTimeout 60000
        --stdio 'mcp-server-filesystem /projects'
    volumes:
      # The ONLY thing the filesystem tool can see, and it cannot write it (ADR-0009).
      - type: bind
        source: "${CORTEX_TOOLS_ROOT:-./sandbox}"
        target: /projects
        read_only: true
    ports:
      # Loopback-only publish so a host-side integration test can reach it (assumption 5).
      - "127.0.0.1:9000:9000"
    restart: unless-stopped
