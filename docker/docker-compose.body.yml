# Body override (Slice 9 per ADR-0023). Layer it ON TOP of the base file:
#     docker compose -f docker-compose.yml -f docker-compose.body.yml up
# It flips the brain from body=none to the grpc backend, so the cortex can call the host body's
# BodyService (OS actions, volume for now). CI never runs this file. The brain->body direction is
# opt-in so CI and the no-body dev loop stay body-free.
#
# Unlike the tool sidecars, the body is NOT a container: it is the host-native Rust/Tauri app
# (ADR-0011), running the BodyService gRPC server. So this override adds no service. It only
# points the brain at the host and lets the container resolve it:
#   - CORTEX_BODY_ENDPOINT reaches the host body over host.docker.internal (assumption 3);
#   - the body binds CORTEX_BODY_ADDR on the host (default 127.0.0.1:50151). For the container
#     to reach it the user binds the body to an interface the container can see (0.0.0.0:50151)
#     and lets the host firewall keep the port host-local. The seam token is the boundary once
#     the bind is not pure loopback (ADR-0023, assumption 5). See docs/runbooks/body-volume.md.
#
# The seam token is the SAME shared CORTEX_SEAM_TOKEN as the BrainService direction: the brain
# attaches it as x-cortex-seam-token metadata, the body's SeamTokenValidator checks it (ADR-0016,
# mirrored). Set it on the host (a .env at the repo root works); empty disables auth both ways.

services:
  brain:
    environment:
      # Opt into the brain->body direction; without this the base image runs body=none (ADR-0023).
      CORTEX_BODY_BACKEND: "grpc"
      # Where the host body's BodyService listens, as seen from the container. 50151 is the
      # body's port (50051 is the brain's BrainService). Override the port to match the host bind.
      CORTEX_BODY_ENDPOINT: "${CORTEX_BODY_ENDPOINT:-host.docker.internal:50151}"
      # Screen capture (ADR-0029). The brain asks the body for at most this long an edge and
      # this many bytes, and holds the reply to the same numbers on receipt, since an older
      # body may ignore both. The byte budget defaults to the body's own 6 MiB ceiling, so the
      # two ends of the seam agree by construction rather than by two constants staying equal.
      # 0 leaves the body's default edge (1600 px). The deadline is the only one on this seam:
      # a blit plus an encode is the only call that can park a host thread.
      CORTEX_BODY_CAPTURE_MAX_EDGE: "${CORTEX_BODY_CAPTURE_MAX_EDGE:-0}"
      CORTEX_BODY_MAX_IMAGE_BYTES: "${CORTEX_BODY_MAX_IMAGE_BYTES:-6291456}"
      CORTEX_BODY_CAPTURE_TIMEOUT_S: "${CORTEX_BODY_CAPTURE_TIMEOUT_S:-10.0}"
      # auto probes the running llama-server's /props once at startup and advertises
      # capture_screen only when it reports a vision tower; on and off fix the answer. The
      # capture tool also needs the host to allow capture at all (CORTEX_HOST_CAPTURE).
      CORTEX_VISION: "${CORTEX_VISION:-auto}"
    # Reach the Windows-host body; host.docker.internal is automatic on Docker Desktop,
    # host-gateway is the portable fallback (ROADMAP assumption 3).
    extra_hosts:
      - "host.docker.internal:host-gateway"
