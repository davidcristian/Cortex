# Memory override (Slice 5 per ADR-0008). Layer it ON TOP of the base file:
#     docker compose -f docker-compose.yml -f docker-compose.memory.yml up
# It adds Postgres + pgvector (the durable MemoryStore) and a CPU embedding llama-server,
# and flips the brain from memory=none to the pgvector backend pointed at them. CI never
# runs this file. Memory is opt-in so CI and the no-GPU dev loop stay DB-free.
#
# LAYERED WITHOUT THE GPU OVERRIDE, RUN IT AS `CORTEX_MEMORY_RECALL=raw docker compose ...`.
# Recall ranking defaults to the model rank (`judge`, ADR-0038 turn-cost addendum), which asks the
# resident cortex which notes help. Against the Echo fake that the base file runs, the reply is not
# the rank envelope, so the policy falls back to raw top-k cosine on every recall: correct, but a
# wasted round trip per turn that the trail reports as a fallback. Naming `raw` says what is
# happening instead, and the pass-through block below is what carries it into the container.
#
# Set these on the host (a .env at the repo root works):
#   CORTEX_MODELS_DIR       host dir holding the GGUFs (default ./models, ADR-0004)
#   CORTEX_EMBED_MODEL_FILE embedding GGUF path under that dir (default: the nomic pick)
#   CORTEX_DB_DIR           host dir receiving the plug-and-play dump (default ./pgdata)
#   CORTEX_DB_SYNC_INTERVAL_S  seconds between automated dumps (default 21600 = 6h)
#   CORTEX_PG_PASSWORD      Postgres password (default `cortex`, a deliberate throwaway
#                           dev-stack default, loopback-only; NOT a secret. Recorded as a
#                           carve-out in the ADR-0008 addendum; override for anything else.)
#
# The live Postgres data lives in a named volume (avoids the ownership/latency pitfalls of a
# PGDATA dir over a Docker-Desktop Windows bind mount, ADR-0008); the plug-and-play export to
# CORTEX_DB_DIR is the pg-backup sidecar below (an automated pg_dump sync, ADR-0008 decision 7),
# not a raw bind mount.

services:
  brain:
    environment:
      # Opt into durable memory; without this the base image runs memory=none (ADR-0008).
      CORTEX_MEMORY_BACKEND: "pgvector"
      CORTEX_MEMORY_DSN: "postgresql://cortex:${CORTEX_PG_PASSWORD:-cortex}@postgres:5432/cortex"
      CORTEX_MEMORY_EMBEDDER_ENDPOINT: "http://llama-embed:8081"
      # Every remaining MemoryConfig field, passed through from the host BY NAME (a bare key with
      # no value is compose's pass-through). Set on the host it reaches the brain; left unset it
      # never enters the container at all, so each shipped default stays declared in exactly one
      # place, `MemoryConfig`, instead of being restated here in a second language where it could
      # drift. The rule is deliberately "every field this file does not itself set" rather than a
      # hand-picked few, so a knob the runbook documents can never be one the dockerized brain has
      # no way to receive, which is what every one of these was until the ADR-0038 harness addendum
      # needed the recall arm changed on a running stack.
      CORTEX_MEMORY_EMBEDDER_MODEL:
      CORTEX_MEMORY_SCOPE:
      CORTEX_MEMORY_ON_TAINTED:
      CORTEX_MEMORY_RECALL:
      CORTEX_MEMORY_RECALL_AUDIT:
      CORTEX_MEMORY_RECALL_HALF_LIFE_DAYS:
      CORTEX_MEMORY_RECALL_RECENCY_WEIGHT:
      CORTEX_MEMORY_RECALL_DEDUP_THRESHOLD:
      CORTEX_MEMORY_RECALL_POOL_FACTOR:
      CORTEX_MEMORY_RECALL_MMR_LAMBDA:
    depends_on:
      postgres:
        condition: service_healthy
      llama-embed:
        condition: service_healthy

  postgres:
    image: "pgvector/pgvector:pg16"
    environment:
      POSTGRES_USER: cortex
      # Throwaway dev default, loopback-only (ADR-0008 addendum carve-out); override on the host.
      POSTGRES_PASSWORD: "${CORTEX_PG_PASSWORD:-cortex}"
      POSTGRES_DB: cortex
    volumes:
      # Live data: a named volume (durable across restarts; not a Windows bind mount).
      - type: volume
        source: cortex-pgdata
        target: /var/lib/postgresql/data
      # Schema bootstrap: runs once on first init (ADR-0008).
      - type: bind
        source: ./docker/postgres/init.sql
        target: /docker-entrypoint-initdb.d/init.sql
        read_only: true
      # The live MemoryStore contract run's own database, given the same bootstrap (ADR-0002
      # addendum on the live-run database). Also runs once on first init, and includes the file
      # above rather than restating its DDL. It stays mounted after init so a data dir created
      # before it can be bootstrapped by hand from the same file (runbook: memory-pgvector.md).
      - type: bind
        source: ./docker/postgres/live-contract-db.sql
        target: /docker-entrypoint-initdb.d/live-contract-db.sql
        read_only: true
    ports:
      # Loopback-only publish so host-side integration tests can reach it (assumption 5).
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortex"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  pg-backup:
    # The automated plug-and-play export (ADR-0008 decision 7): the live data stays in the
    # named volume; this sidecar pg_dumps it into CORTEX_DB_DIR on an interval (immediately
    # on start, then every CORTEX_DB_SYNC_INTERVAL_S), so the guarantee never depends on a
    # manually-run step. Same image as the server, so pg_dump matches the major version.
    image: "pgvector/pgvector:pg16"
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGPASSWORD: "${CORTEX_PG_PASSWORD:-cortex}"
      CORTEX_DB_SYNC_INTERVAL_S: "${CORTEX_DB_SYNC_INTERVAL_S:-21600}"
    volumes:
      - type: bind
        source: "${CORTEX_DB_DIR:-./pgdata}"
        target: /backup
      - type: bind
        source: ./docker/postgres/backup.sh
        target: /backup.sh
        read_only: true
    tmpfs:
      # Postgres' own data directory, which this sidecar never fills: it runs backup.sh and
      # pg_dumps the server over the network, so it holds no database of its own. The image
      # declares a volume there all the same, and a container with nothing mounted at it gets an
      # anonymous volume docker fills from the image and `down` leaves on the host under a name
      # nobody picked, one per start. A tmpfs gives that declaration nothing to anonymise. The
      # probe stack covers dovecot's two declarations the same way and for the same reason
      # (docker-compose.imap-probe.yml); scripts/volumecheck.py is what now checks that every
      # such declaration is covered, rather than leaving it to whoever remembers.
      - /var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  llama-embed:
    # CPU build (no CUDA): embeddings run on CPU, off the GPU budget (ADR-0004 addendum).
    image: "ghcr.io/ggml-org/llama.cpp:server"
    # --embeddings turns on /v1/embeddings; -ngl 0 keeps it entirely on the CPU. The model
    # is the nomic pick (ADR-0004); override the path with CORTEX_EMBED_MODEL_FILE.
    command:
      - "--model"
      - "/models/${CORTEX_EMBED_MODEL_FILE:-nomic-ai/nomic-embed-text-v1.5-GGUF/nomic-embed-text-v1.5.Q8_0.gguf}"
      - "--embeddings"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8081"
      - "-ngl"
      - "0"
    volumes:
      # Models stay on the Windows drive, mounted read-only (ADR-0004); override with CORTEX_MODELS_DIR.
      - type: bind
        source: "${CORTEX_MODELS_DIR:-./models}"
        target: /models
        read_only: true
    ports:
      # Loopback-only publish so the host-side embedder integration test can reach it.
      - "127.0.0.1:8081:8081"
    healthcheck:
      # If this image ships without curl, swap the test for a python poke (see the runbook).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
      start_interval: 2s
    restart: unless-stopped

volumes:
  cortex-pgdata:
