# Memory override: it adds Postgres with pgvector and a CPU embedding llama-server, and points the
# brain at them (docs/runbooks/memory-pgvector.md). Without the gpu override, start it as
# `CORTEX_MEMORY_RECALL=raw docker compose ...`: ranking asks the cortex, and the Echo fake cannot.

services:
  brain:
    environment:
      # Opt into durable memory; without this the base image keeps no memories.
      CORTEX_MEMORY_BACKEND: "pgvector"
      CORTEX_MEMORY_DSN: "postgresql://cortex:${CORTEX_PG_PASSWORD:-cortex}@postgres:5432/cortex"
      CORTEX_MEMORY_EMBEDDER_ENDPOINT: "http://llama-embed:8081"
      # Every remaining `MemoryConfig` field, passed through from the host by name, so each
      # shipped default stays declared in that one class. The rule is every field this file does
      # not set itself, so a setting the runbook documents always reaches the container.
      CORTEX_MEMORY_EMBEDDER_MODEL:
      CORTEX_MEMORY_SCOPE:
      CORTEX_MEMORY_ON_TAINTED:
      CORTEX_MEMORY_RECALL:
      CORTEX_MEMORY_RECALL_AUDIT:
      CORTEX_MEMORY_RECALL_AUDIT_FILE:
      CORTEX_MEMORY_RECALL_HALF_LIFE_DAYS:
      CORTEX_MEMORY_RECALL_RECENCY_WEIGHT:
      CORTEX_MEMORY_RECALL_DEDUP_THRESHOLD:
      CORTEX_MEMORY_RECALL_POOL_FACTOR:
      CORTEX_MEMORY_RECALL_MMR_LAMBDA:
    depends_on:
      postgres:
        condition: service_healthy
      llama-embed:
        condition: service_healthy

  postgres:
    image: "pgvector/pgvector:pg16"
    environment:
      POSTGRES_USER: cortex
      # A throwaway development default on loopback only, not a secret; override it on the host.
      POSTGRES_PASSWORD: "${CORTEX_PG_PASSWORD:-cortex}"
      POSTGRES_DB: cortex
    volumes:
      # Live data in a named volume, which survives restarts and avoids a Windows bind mount.
      - type: volume
        source: cortex-pgdata
        target: /var/lib/postgresql/data
      # Schema setup, applied once when the data directory is first created.
      - type: bind
        source: ./docker/postgres/init.sql
        target: /docker-entrypoint-initdb.d/init.sql
        read_only: true
      # A separate database for the live MemoryStore contract tests, set up from the same file
      # above. It stays mounted afterwards so an older data directory can be set up by hand.
      - type: bind
        source: ./docker/postgres/live-contract-db.sql
        target: /docker-entrypoint-initdb.d/live-contract-db.sql
        read_only: true
    ports:
      # Published on loopback so host-side integration tests can reach it.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortex"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  pg-backup:
    # The automated export: the live data stays in the named volume, and this sidecar pg_dumps it
    # into CORTEX_DB_DIR on start and then every CORTEX_DB_SYNC_INTERVAL_S seconds. It uses the
    # same image as the server so that pg_dump matches the major version.
    image: "pgvector/pgvector:pg16"
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGPASSWORD: "${CORTEX_PG_PASSWORD:-cortex}"
      CORTEX_DB_SYNC_INTERVAL_S: "${CORTEX_DB_SYNC_INTERVAL_S:-21600}"
    volumes:
      - type: bind
        source: "${CORTEX_DB_DIR:-./pgdata}"
        target: /backup
      - type: bind
        source: ./docker/postgres/backup.sh
        target: /backup.sh
        read_only: true
    tmpfs:
      # Postgres' own data directory, which this sidecar never uses. The image declares a volume
      # there, and a container with nothing mounted at it collects an anonymous volume that `down`
      # leaves on the host; a tmpfs leaves that declaration nothing to fill.
      - /var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  llama-embed:
    # CPU build (no CUDA): embeddings run on the CPU, outside the GPU budget.
    image: "ghcr.io/ggml-org/llama.cpp:server"
    # --embeddings turns on /v1/embeddings and -ngl 0 keeps it entirely on the CPU. Override the
    # model path with CORTEX_MODEL_FILE_EMBED.
    command:
      - "--model"
      - "/models/${CORTEX_MODEL_FILE_EMBED:-nomic-ai/nomic-embed-text-v1.5-GGUF/nomic-embed-text-v1.5.Q8_0.gguf}"
      - "--embeddings"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8081"
      - "-ngl"
      - "0"
    volumes:
      # Models stay on the host drive, mounted read-only; override with CORTEX_MODELS_DIR.
      - type: bind
        source: "${CORTEX_MODELS_DIR:-./models}"
        target: /models
        read_only: true
    ports:
      # Published on loopback so the host-side embedder integration test can reach it.
      - "127.0.0.1:8081:8081"
    healthcheck:
      # If this image ships without curl, use a python request instead; see the runbook.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
      start_interval: 2s
    restart: unless-stopped

volumes:
  cortex-pgdata:
