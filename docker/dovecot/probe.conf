## The whole configuration of the IMAP probe, replacing the one the image ships. It makes a server
## say both things a NO to SELECT can mean. NO CREDENTIAL LIVES HERE: the passdb accepts any user
## and any password, which is safe only because the probe is loopback-only and holds no mail.

protocols = imap
listen = *

# The mail root comes from the compose file as an environment variable. This line is what passes
# that variable from the master process to the auth and mail processes that expand it; without it
# every home resolves under the filesystem root and every mailbox goes missing at once.
import_environment = $import_environment CORTEX_IMAP_PROBE_MAIL_ROOT

# Any user, any password: `nopassword=y` is dovecot's own way of not checking a password.
passdb {
  driver = static
  args = nopassword=y
}

# Static too, so nothing has to be provisioned before the tree is built. This `home` is what `~`
# below expands to; a `mail_home` beside it was measured to change nothing while this userdb
# replies.
userdb {
  driver = static
  args = uid=1000 gid=1000 home=%{env:CORTEX_IMAP_PROBE_MAIL_ROOT}/%Lu
}

# One throwaway mailbox tree per user under the root above, so a restart starts from nothing.
mail_location = sdbox:~/Mail
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
last_valid_uid = 1000

namespace {
  inbox = yes
  separator = /
}

# STARTTLS on 143 with the self-signed certificate the image ships, which is how the Bridge is
# reached too. The files are named where they really live, because the image's symlinks to them
# are under the tmpfs mount.
ssl = yes
ssl_cert = </etc/ssl/certs/ssl-cert-snakeoil.pem
ssl_key = </etc/ssl/private/ssl-cert-snakeoil.key

# The ACL plugin is what lets a mailbox exist, be listed, and still refuse to open.
mail_plugins = $mail_plugins acl
protocol imap {
  mail_plugins = $mail_plugins imap_acl
}
plugin {
  acl = vfile
}

# A FETCH that fails for a reason of the server's own is answered with a tagged NO and the
# connection stays open, rather than with a `* BYE` and a drop. That NO is what the declined-read
# test needs a real server to have sent, and the ProtonMail Bridge never sends it.
imap_fetch_failure = no-after

log_path = /dev/stdout
info_log_path = /dev/stdout
