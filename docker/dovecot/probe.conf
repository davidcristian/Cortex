## The whole configuration of the IMAP probe (docker/docker-compose.imap-probe.yml), replacing
## the one the image ships. It exists to make a server say the two different things a NO to
## SELECT covers, which the ProtonMail Bridge this repo talks to can only say one of.
##
## NO CREDENTIAL LIVES HERE. The passdb accepts any user and any password, which is safe only
## because the probe listens on loopback, holds no mail, and is started by hand for a
## measurement (docs/runbooks/email-imap.md). Never point anything else at it.

protocols = imap
listen = *

# The mail root is the compose file's (docker/docker-compose.imap-probe.yml), handed in as an
# environment variable rather than written here, so the tmpfs that makes the store throwaway, the
# tree the entrypoint builds and the home resolved below are one spelling. Dovecot expands it with
# `%{env:...}` in the userdb below, and this line is what carries the variable past the master
# process into the auth and mail processes that do the expanding: without it the expansion is
# empty, every account's home resolves under the filesystem root, and every mailbox goes missing
# at once. `$ENV:NAME` is not the spelling here; it is not expanded at all, and a home written
# that way resolves to nothing.
import_environment = $import_environment CORTEX_IMAP_PROBE_MAIL_ROOT

# Any user, any password: `nopassword=y` is dovecot's own way of saying the password is not
# checked, so nothing here is a secret to leak or to rotate.
passdb {
  driver = static
  args = nopassword=y
}

# Static too, so that nothing has to be provisioned before the tree is built. It does not let
# `doveadm` run before the server listens, as was once assumed here: a `doveadm save` against
# this userdb was measured to fail with `connect(/run/dovecot/auth-userdb) failed` until the
# server had started, which is why probe-mailboxes.sh builds the tree with mkdir and starts the
# server once to save the one message it seals. The `home` here is the only thing that resolves
# one: a userdb that answers with a home is what `~` below expands to, and a `mail_home` beside
# it was measured to change nothing while this userdb answers, so the one place is this one.
userdb {
  driver = static
  args = uid=1000 gid=1000 home=%{env:CORTEX_IMAP_PROBE_MAIL_ROOT}/%Lu
}

# One throwaway mailbox tree per user under the root above, so a restart starts from nothing.
mail_location = sdbox:~/Mail
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
last_valid_uid = 1000

namespace {
  inbox = yes
  separator = /
}

# STARTTLS on 143 with the self-signed cert the image ships, which is the shape the Bridge has
# too, so `ImapMailbox` reaches this server over the same security setting it reaches that one.
# Named where the pair really lives rather than through the `cert.pem` and `key.pem` symlinks the
# image leaves in its configuration directory: that directory is a tmpfs here, mounted so docker's
# own volume declaration at the path has nothing to fill, and the symlinks are under the mount.
ssl = yes
ssl_cert = </etc/ssl/certs/ssl-cert-snakeoil.pem
ssl_key = </etc/ssl/private/ssl-cert-snakeoil.key

# The ACL plugin is the whole point: it is what lets a mailbox exist, be listed, and still
# refuse to open, which is the refusal this repo had never seen a real server produce.
mail_plugins = $mail_plugins acl
protocol imap {
  mail_plugins = $mail_plugins imap_acl
}
plugin {
  acl = vfile
}

# A FETCH that fails for a reason of the server's own is answered with a tagged NO rather than
# with a `* BYE` and a dropped connection. Dovecot documents three behaviours for that case, and
# this is the one the ProtonMail Bridge cannot produce at all: a `NO` to a `UID FETCH`, which is
# the answer the Mailbox contract's declined-read check needs a real server to have sent. Measured
# on 2.3.21 over the message probe-mailboxes.sh seals: the default `disconnect-immediately` and
# `disconnect-after` both answer `* BYE FETCH failed: Internal error occurred. Refer to server log
# for more information.` and close the connection, where this answers `NO [SERVERBUG] Internal
# error occurred. Refer to server log for more information.` and keeps it open (ADR-0022
# declined-read addendum).
imap_fetch_failure = no-after

log_path = /dev/stdout
info_log_path = /dev/stdout
