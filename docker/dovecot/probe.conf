## The whole configuration of the IMAP probe (docker/docker-compose.imap-probe.yml), replacing
## the one the image ships. It exists to make a server say the two different things a NO to
## SELECT covers, which the ProtonMail Bridge this repo talks to can only say one of.
##
## NO CREDENTIAL LIVES HERE. The passdb accepts any user and any password, which is safe only
## because the probe listens on loopback, holds no mail, and is started by hand for a
## measurement (docs/runbooks/email-imap.md). Never point anything else at it.

protocols = imap
listen = *

# Any user, any password: `nopassword=y` is dovecot's own way of saying the password is not
# checked, so nothing here is a secret to leak or to rotate.
passdb {
  driver = static
  args = nopassword=y
}

# Static too, so the bootstrap below can build the mailbox tree with `doveadm` before the
# server is listening: a userdb dovecot can answer out of the configuration needs no running
# auth socket, and the tree has to be there before the first connection arrives.
userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail/%Lu
}

# One throwaway mailbox tree per user under a tmpfs, so a restart starts from nothing.
mail_home = /srv/mail/%Lu
mail_location = sdbox:~/Mail
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
last_valid_uid = 1000

namespace {
  inbox = yes
  separator = /
}

# STARTTLS on 143 with the self-signed cert the image ships, which is the shape the Bridge has
# too, so `ImapMailbox` reaches this server over the same security setting it reaches that one.
ssl = yes
ssl_cert = </etc/dovecot/cert.pem
ssl_key = </etc/dovecot/key.pem

# The ACL plugin is the whole point: it is what lets a mailbox exist, be listed, and still
# refuse to open, which is the refusal this repo had never seen a real server produce.
mail_plugins = $mail_plugins acl
protocol imap {
  mail_plugins = $mail_plugins imap_acl
}
plugin {
  acl = vfile
}

log_path = /dev/stdout
info_log_path = /dev/stdout
