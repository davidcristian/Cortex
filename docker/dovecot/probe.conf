
protocols = imap
listen = *

import_environment = $import_environment CORTEX_IMAP_PROBE_MAIL_ROOT

# Any user, any password: `nopassword=y` is dovecot's own way of saying the password is not
# checked, so nothing here is a secret to leak or to rotate.
passdb {
  driver = static
  args = nopassword=y
}

userdb {
  driver = static
  args = uid=1000 gid=1000 home=%{env:CORTEX_IMAP_PROBE_MAIL_ROOT}/%Lu
}

# One throwaway mailbox tree per user under the root above, so a restart starts from nothing.
mail_location = sdbox:~/Mail
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
last_valid_uid = 1000

namespace {
  inbox = yes
  separator = /
}

ssl = yes
ssl_cert = </etc/ssl/certs/ssl-cert-snakeoil.pem
ssl_key = </etc/ssl/private/ssl-cert-snakeoil.key

# The ACL plugin is the whole point: it is what lets a mailbox exist, be listed, and still
# refuse to open, which is the refusal this repo had never seen a real server produce.
mail_plugins = $mail_plugins acl
protocol imap {
  mail_plugins = $mail_plugins imap_acl
}
plugin {
  acl = vfile
}

log_path = /dev/stdout
info_log_path = /dev/stdout
