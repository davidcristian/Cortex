
name: cortex

services:
  brain:
    build: ./brain
    environment:
      # Bind all container interfaces; exposure is governed by `ports` (ADR-0003 d6).
      CORTEX_SEAM_HOST: "0.0.0.0"
      # The shared seam secret (assumption 5, ADR-0016), passed through from the host
      # env / .env (never committed). Empty (the default) disables the token check.
      CORTEX_SEAM_TOKEN: ${CORTEX_SEAM_TOKEN:-}
      # Session state lives in the redis service, per the one hard rule: restarting the
      # brain container must lose no conversation (see the runbook's restart check).
      CORTEX_REDIS_URL: "redis://redis:6379/0"
      # Durable schedules + the reminder ticker (ADR-0025) over the same append-only
      # redis. Off by default; set CORTEX_SCHEDULE_BACKEND=redis (e.g. in .env) to enable.
      CORTEX_SCHEDULE_BACKEND: ${CORTEX_SCHEDULE_BACKEND:-none}
      # The IANA zone every model-facing schedule time renders in, and the zone an
      # offset-less 'at' is read as (ADR-0025 display addendum). Display only: stored due
      # times stay UTC. An unknown key fails the brain at startup, by design.
      CORTEX_SCHEDULE_TZ: ${CORTEX_SCHEDULE_TZ:-UTC}
      CORTEX_TOOLS_SALIENCE: ${CORTEX_TOOLS_SALIENCE:-repeat}
      CORTEX_TOOLS_SALIENCE_LIMIT: ${CORTEX_TOOLS_SALIENCE_LIMIT:-2}
      CORTEX_TOOLS_CALL_TIMEOUT_S: ${CORTEX_TOOLS_CALL_TIMEOUT_S:-60.0}
      CORTEX_LOG_FORMAT: ${CORTEX_LOG_FORMAT:-plain}
    ports:
      # Loopback-only publish for the single-user security posture (ROADMAP assumption 5):
      # nothing listens beyond 127.0.0.1 on the host.
      - "127.0.0.1:50051:50051"
    restart: unless-stopped
    # tini as PID 1 so SIGTERM reaches Python and `docker compose down` stays fast.
    init: true
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, grpc, cortex_seam as seam; token = os.environ.get('CORTEX_SEAM_TOKEN', ''); metadata = (('x-cortex-seam-token', token),) if token else None; seam.BrainServiceStub(grpc.insecure_channel('127.0.0.1:50051')).Health(seam.HealthRequest(), timeout=2, metadata=metadata)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 1s

  redis:
    # redis over valkey: redis-py + fakeredis (the contract-test twin) track Redis
    # semantics first, and Redis 8 is open source again (AGPLv3 option). Rationale
    # in docs/runbooks/local-dev-wsl.md.
    image: redis:8-alpine
    # Append-only persistence so sessions also survive a redis restart, not just a
    # brain restart; data lives in the named volume below.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Loopback-only publish, for dev inspection with a host redis-cli (assumption 5).
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s

volumes:
  redis-data:
