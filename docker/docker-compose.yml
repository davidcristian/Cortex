# Brain services (Slice 3: cortex-only chat; state in redis). The body is host-native
# and never dockerized (AGENTS.md). CPU-only, with no GPU anywhere in this file; the GPU
# override (docker-compose.gpu.yml: llama.cpp servers + device reservations, ADR-0005)
# arrives with Slice 4
# (docs/ROADMAP.md). Ops loop: docs/runbooks/local-dev-wsl.md.
#
# Compose files live under docker/; always invoke with `--project-directory .` from the repo root
# (the `just` recipes do) so relative paths (./brain, ./docker/postgres, ./sandbox) and the .env
# resolve from the root, not from docker/. `name:` pins the `cortex` project name so containers and
# volumes stay stable regardless of the checkout directory.

name: cortex

services:
  brain:
    build: ./brain
    environment:
      # Bind all container interfaces; exposure is governed by `ports` (ADR-0003 d6).
      CORTEX_SEAM_HOST: "0.0.0.0"
      # The shared seam secret (assumption 5, ADR-0016), passed through from the host
      # env / .env (never committed). Empty (the default) disables the token check.
      CORTEX_SEAM_TOKEN: ${CORTEX_SEAM_TOKEN:-}
      # Session state lives in the redis service, per the one hard rule: restarting the
      # brain container must lose no conversation (see the runbook's restart check).
      CORTEX_REDIS_URL: "redis://redis:6379/0"
      # Durable schedules + the reminder ticker (ADR-0025) over the same append-only
      # redis. Off by default; set CORTEX_SCHEDULE_BACKEND=redis (e.g. in .env) to enable.
      CORTEX_SCHEDULE_BACKEND: ${CORTEX_SCHEDULE_BACKEND:-none}
      # The IANA zone every model-facing schedule time renders in, and the zone an
      # offset-less 'at' is read as (ADR-0025 display addendum). Display only: stored due
      # times stay UTC. An unknown key fails the brain at startup, by design.
      CORTEX_SCHEDULE_TZ: ${CORTEX_SCHEDULE_TZ:-UTC}
      # Which tool calls a loop bothers dispatching (ADR-0009 salience addendum): the default
      # 'repeat' refuses a call the loop has already made (once per round, twice per loop),
      # 'off' restores the unfiltered loop. Listed here rather than in the tool overrides so
      # the knob works whichever sidecar set is layered on, and is not silently inert.
      CORTEX_TOOLS_SALIENCE: ${CORTEX_TOOLS_SALIENCE:-repeat}
    ports:
      # Loopback-only publish for the single-user security posture (ROADMAP assumption 5):
      # nothing listens beyond 127.0.0.1 on the host.
      - "127.0.0.1:50051:50051"
    restart: unless-stopped
    # tini as PID 1 so SIGTERM reaches Python and `docker compose down` stays fast.
    init: true
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # The real BrainService.Health RPC via the installed cortex_seam package, since
      # a bare TCP poke could pass while the gRPC server is broken. Attaches the
      # seam token when one is configured (ADR-0016), or the check would flap.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, grpc, cortex_seam as seam; token = os.environ.get('CORTEX_SEAM_TOKEN', ''); metadata = (('x-cortex-seam-token', token),) if token else None; reply = seam.BrainServiceStub(grpc.insecure_channel('127.0.0.1:50051')).Health(seam.HealthRequest(), timeout=2, metadata=metadata); raise SystemExit(0 if reply.ready else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 1s

  redis:
    # redis over valkey: redis-py + fakeredis (the contract-test twin) track Redis
    # semantics first, and Redis 8 is open source again (AGPLv3 option). Rationale
    # in docs/runbooks/local-dev-wsl.md.
    image: redis:8-alpine
    # Append-only persistence so sessions also survive a redis restart, not just a
    # brain restart; data lives in the named volume below.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Loopback-only publish, for dev inspection with a host redis-cli (assumption 5).
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s

volumes:
  redis-data:
