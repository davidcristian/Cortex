# Lint and format settings for all Python in the repo. Each uv project runs ruff over its own
# tree, and ruff finds this file by walking up. Keep the ignore lists short, with a reason each.

target-version = "py312"
line-length = 100
src = [
  "brain/packages/body_client/src",
  "brain/packages/core/src",
  "brain/packages/email/src",
  "brain/packages/embedding/src",
  "brain/packages/inference/src",
  "brain/packages/memory/src",
  "brain/packages/model_manager/src",
  "brain/packages/orchestrator/src",
  "brain/packages/seam/src",
  "brain/packages/session/src",
  "brain/packages/tools/src",
  "scripts",
]
# Generated code is not checked.
extend-exclude = ["**/_generated"]

[lint]
select = ["ALL"]
ignore = [
  "D",      # docstring style rules: module contracts live in docs/modules/ (AGENTS.md DoD)
  "COM812", # trailing-comma rule conflicts with the ruff formatter
  "ISC001", # implicit-str-concat rule conflicts with the ruff formatter
]

[lint.pylint]
# TurnEngine takes three ports, a TurnCapabilities bundle, the model id and the turn-id factory.
# Group optional collaborators into a bundle, as TurnCapabilities does, rather than raising this.
max-args = 6

[lint.per-file-ignores]
"scripts/*.py" = [
  "T201", # these checks are command line tools; they report on stdout and stderr
]
"brain/packages/core/src/cortex_core/__init__.py" = [
  "F403", # the barrel re-exports its area sub-barrels wholesale; each declares its own __all__
]
"**/tests/**" = [
  "S101",    # tests use bare asserts by design (pytest)
  "PLR2004", # magic values in assertions are the point of a test
  "INP001",  # test dirs are intentionally not packages (pytest rootdir-based discovery)
]

[format]
docstring-code-format = true
