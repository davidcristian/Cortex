// body.proto defines the gRPC interface between the body and the brain, and is the single source
// of truth for it. Field numbers are stable: extend, never renumber. The stubs are committed on
// both sides; regenerate them with `just proto`.

syntax = "proto3";

package cortex.seam.v1;

// ---------------------------------------------------------------------------
// BrainService is hosted by the brain, in Docker. The body is the client.
// ---------------------------------------------------------------------------
service BrainService {
  // One conversational exchange per overlay session. Client events send user turns and
  // cancellations; server events stream tokens, tool activity and status, such as a model
  // loading during a handoff.
  rpc Converse(stream ClientEvent) returns (stream ServerEvent);

  // Liveness and readiness, for the overlay's connection indicator.
  rpc Health(HealthRequest) returns (HealthReply);

  // Read-only views of the session store, for the overlay's chat list and switcher.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsReply);
  rpc GetSessionMessages(GetSessionMessagesRequest) returns (GetSessionMessagesReply);

  // Reminder pull delivery: the overlay shows what has fired and is still undelivered, then
  // acks what it showed. A brain with no schedule store answers an empty list and acked=false
  // rather than an error, because it cannot be told from one with nothing due.
  rpc ListDueReminders(ListDueRemindersRequest) returns (ListDueRemindersReply);
  rpc AckReminder(AckReminderRequest) returns (AckReminderReply);

  // Renames a chat. Reachable only from the overlay's own list controls, never from a model or
  // a tool, and it stores a display title only, never conversation content. An empty title
  // clears the override, so the title derived from the first message applies again.
  rpc RenameSession(RenameSessionRequest) returns (RenameSessionReply);

  // Deletes a chat: destructive and irreversible. The transcript, the catalog entry and the
  // session's private memories all go. The overlay asks the user to confirm before sending
  // this, and the body makes exactly one attempt so a lost reply cannot destroy twice.
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionReply);

  // Hoists or lowers a chat. A hoisted chat is listed whatever its age, above the chats
  // listed by recency. Reachable only from the overlay's list controls, and the body
  // makes exactly one attempt.
  rpc SetSessionHoisted(SetSessionHoistedRequest) returns (SetSessionHoistedReply);

  // The user's settings: a durable key/value record the brain owns, so a choice survives a body
  // restart. Keys are namespaced names the caller owns ("overlay.theme"); values are short
  // strings the brain stores and returns without reading them. An empty value clears the key.
  rpc GetPreferences(GetPreferencesRequest) returns (GetPreferencesReply);
  rpc SetPreference(SetPreferenceRequest) returns (SetPreferenceReply);
}

message ClientEvent {
  string session_id = 1;
  oneof event {
    UserTurn user_turn = 2;   // text, and an attached capture when there is one
    Cancel cancel = 3;        // stop generating the current turn
    ConfirmResponse confirm_response = 4; // the user's answer to a ConfirmRequest
  }
}

message UserTurn {
  string text = 1;
  repeated ImageBlob images = 2; // for example a screen capture the user attached
}

message Cancel {}

message ServerEvent {
  oneof event {
    TextDelta text_delta = 1;      // streamed assistant tokens
    ToolActivity tool_activity = 2; // a tool is about to run
    StatusUpdate status = 3;        // a model swap in progress, a queue position
    TurnComplete turn_complete = 4;
    SeamError error = 5;
    ConfirmRequest confirm_request = 6; // a tool call is waiting for the user's approval
    ConfirmResolved confirm_resolved = 7; // the brain stopped waiting for an answer
    ToolOutcome tool_outcome = 8;   // how a tool call announced above ended
    Heartbeat heartbeat = 9;        // the turn is still running, and what it waits on
  }
}

// Sent by the stream itself, not by the turn, once per heartbeat period while a turn task is
// running and nothing else is waiting to be sent, so a live brain and a dead one differ within
// minutes. It repeats the turn's current wait, which a dropped StatusUpdate may have lost.
message Heartbeat {
  string wait = 1;   // a StatusUpdate state such as queued or calling, or "" for none
  string detail = 2; // the sentence the overlay shows for the wait
}

message TextDelta { string text = 1; }
message ToolActivity { string tool_name = 1; string summary = 2; }

// How one announced tool call ended. A subagent's steps also reach this stream as activities,
// over a channel that drops events when full, so an activity with no outcome is ordinary and
// the proto3 default false is the safe reading: it leaves a surface at its weaker claim.
message ToolOutcome { string tool_name = 1; bool ok = 2; }
message StatusUpdate { string state = 1; string detail = 2; }
message TurnComplete { string turn_id = 1; }
message SeamError { string code = 1; string message = 2; }

// The user's approval of an outbound or irreversible tool call. The brain emits ConfirmRequest
// mid-turn and suspends the call until the matching ConfirmResponse arrives, the timeout denies
// it, or the stream dies. An unanswered or unmatched request always ends as a denial.
message ConfirmRequest {
  string confirm_id = 1;      // correlation id, minted per request by the brain
  string tool_name = 2;       // what would run, for example "send_email"
  string arguments_json = 3;  // the exact draft being approved, one JSON object
  string reason = 4;          // why confirmation is required, shown to the user as written
}
message ConfirmResponse {
  string confirm_id = 1;      // echoes the request it answers
  bool approved = 2;
}

// A ConfirmRequest the brain stopped waiting on, so the overlay can close a card the user can no
// longer answer. Emitted only for endings the client cannot already know: the confirm timeout,
// and client input half-closing.
message ConfirmResolved {
  string confirm_id = 1;      // which ConfirmRequest ended
  string outcome = 2;         // "timeout" or "unavailable"; it explains, it never approves
}

message HealthRequest {}
message HealthReply { bool ready = 1; string detail = 2; }

// Recent chats, most-recently-active first. `limit` caps the count; 0 means the server default.
message ListSessionsRequest { int32 limit = 1; }
message ListSessionsReply { repeated SessionSummary sessions = 1; }
message SessionSummary {
  string session_id = 1;
  string title = 2;                // derived: first user message, one line, truncated
  string preview = 3;              // derived: last message text, one line, truncated
  int64 last_activity_unix_ms = 4; // for a relative timestamp in the switcher
  bool hoisted = 5;                // listed whatever its age, above the chats sorted by recency
}

// One session's stored history, in append order.
message GetSessionMessagesRequest { string session_id = 1; }
message GetSessionMessagesReply { repeated SessionMessage messages = 1; }
message SessionMessage {
  string role = 1; // "user" or "assistant", the only stored roles
  string text = 2;
  string turn_id = 3;
  int64 at_unix_ms = 4;
}

// Renames one chat. `title` is the new display label, and "" clears any custom or
// brain-generated title. The reply is a bare acknowledgement; a store failure arrives as an
// UNAVAILABLE status.
message RenameSessionRequest {
  string session_id = 1;
  string title = 2;
}
message RenameSessionReply {}

// Deletes one chat, its transcript and its private memories. The reply is a bare
// acknowledgement; a store or memory failure arrives as UNAVAILABLE and the call is idempotent,
// so a later attempt finishes it. A memory reply the brain cannot decode arrives as INTERNAL.
message DeleteSessionRequest {
  string session_id = 1;
}
message DeleteSessionReply {}

// Hoists or lowers one chat. The reply is a bare acknowledgement; a store failure arrives as an
// UNAVAILABLE status. Setting the same value twice changes nothing.
message SetSessionHoistedRequest {
  string session_id = 1;
  bool hoisted = 2;
}
message SetSessionHoistedReply {}

// The user's settings record. One pair is one setting; the brain stores and returns them as
// given and never reads a value, so adding a setting costs no change here.
message Preference {
  string key = 1;
  string value = 2;
}
message GetPreferencesRequest {}
message GetPreferencesReply { repeated Preference preferences = 1; }
message SetPreferenceRequest {
  string key = 1;
  string value = 2;
}
message SetPreferenceReply {}

// Reminders that have fired and are still undelivered, across every session, because a
// single-user assistant has one user to remind. session_id is sent too, so the overlay can later
// offer to open the conversation a reminder came from without a change here.
message ListDueRemindersRequest {}
message ListDueRemindersReply { repeated DueReminder reminders = 1; }
message DueReminder {
  string reminder_id = 1;
  string text = 2;
  int64 fired_at_unix_ms = 3; // when it became deliverable
  bool recurring = 4;
  bool tainted = 5;           // untrusted origin, so the overlay may mark it
  string session_id = 6;      // the chat it came from; "" when there was none
}
message AckReminderRequest {
  string reminder_id = 1;
  // Which fire this ack delivers, from the card's DueReminder.fired_at_unix_ms. The brain
  // clears the slot only while it still holds that fire, so a card dismissed after a later fire
  // replaced it clears nothing. 0, from a body built before this field, acks whichever is held.
  int64 fired_at_unix_ms = 2;
}
message AckReminderReply { bool acked = 1; }

// ---------------------------------------------------------------------------
// BodyService is hosted by the body. The brain is the client.
// ---------------------------------------------------------------------------
service BodyService {
  rpc CaptureScreen(CaptureScreenRequest) returns (CaptureScreenReply);
  rpc GetVolume(GetVolumeRequest) returns (VolumeState);
  rpc SetVolume(SetVolumeRequest) returns (VolumeState);
  rpc InjectInput(InjectInputRequest) returns (InjectInputReply);
  // Shows a native notification, which is the push half of reminder delivery. shown=true means
  // the OS displayed it, and the brain then acks the reminder; false or an error leaves the
  // reminder deliverable. The body escapes the text, because a toast template is XML.
  rpc Notify(NotifyRequest) returns (NotifyReply);
}

// What the body points the camera at. A closed set the body resolves, never a rectangle the
// caller names: only the body knows where windows are, and a caller that guessed one would spend
// a whole capture on the wrong part of the screen.
enum CaptureTarget {
  // The primary display, whole, and the proto3 default.
  CAPTURE_TARGET_DISPLAY = 0;
  // The topmost visible top-level window that is neither the body's own nor excluded from
  // capture. Not the foreground window: the overlay is in front when this runs. With no such
  // window the body answers FAILED_PRECONDITION, because a fallback would capture more.
  CAPTURE_TARGET_FOCUS = 1;
}

message CaptureScreenRequest {
  // Longest edge of the returned image, in physical pixels. 0 means "the body's
  // default" (1600). The body clamps it and, being proto3, may ignore it, so the brain checks
  // the reply rather than relying on it.
  uint32 max_edge = 1;
  // What to point at. A body older than this field ignores it, so the brain checks the reply.
  // An unrecognized value reads as CAPTURE_TARGET_DISPLAY.
  CaptureTarget target = 2;
  // The most bytes the caller will accept, so the brain's image budget and the body's limit are
  // one number. 0 means the body's own limit, and anything larger is clamped down to it, so this
  // can only tighten the bound. Like max_edge, the brain checks the reply.
  uint32 max_bytes = 3;
}
message CaptureScreenReply {
  ImageBlob image = 1;
  // What the body pointed at, so the brain does not describe a crop as a shrunk screen. It is
  // read off the encoded picture rather than off the request, so a window filling the display
  // answers CAPTURE_TARGET_DISPLAY, and the zero is DISPLAY.
  CaptureTarget resolved_target = 2;
}

message ImageBlob {
  bytes data = 1;
  string mime_type = 2; // for example image/png
  uint32 width = 3;     // physical pixels, after the body's downscale
  uint32 height = 4;
  // The display's own size before the downscale, so the model can say the text is too small to
  // read instead of guessing.
  uint32 source_width = 5;
  uint32 source_height = 6;
  // When the pixels were read, so a multi-round turn can tell how old they are.
  int64 captured_at_unix_ms = 7;
}

message GetVolumeRequest {}
message SetVolumeRequest {
  // Both fields have explicit presence, so a caller can set level, mute, or both.
  optional float level = 1; // clamped to [0.0, 1.0]
  optional bool mute = 2;
}
message VolumeState {
  float level = 1;
  bool muted = 2;
}

message InjectInputRequest {
  oneof input {
    TypeText type_text = 1; // literal text entry
    KeyChord key_chord = 2; // for example ctrl+shift+esc
  }
}
message TypeText { string text = 1; }
message KeyChord { repeated string keys = 1; }
message InjectInputReply { bool applied = 1; }

message NotifyRequest {
  string title = 1;
  string body = 2;
  string reminder_id = 3;
  bool tainted = 4; // matches DueReminder, so the toast can mark where the text came from
}
message NotifyReply { bool shown = 1; }
