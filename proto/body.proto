// body.proto is the single source of truth for the body<->brain seam (AGENTS.md).

syntax = "proto3";

package cortex.seam.v1;

// ---------------------------------------------------------------------------
// BrainService is hosted by the brain (Docker). The body is the client.
// ---------------------------------------------------------------------------
service BrainService {
  // One conversational exchange stream per overlay session. Client events carry user
  // turns and cancellations; server events stream tokens, tool activity, and status
  // (e.g. "brain model loading" during a handoff, so the overlay can show progress).
  rpc Converse(stream ClientEvent) returns (stream ServerEvent);

  // Liveness/readiness for the overlay to display connection state.
  rpc Health(HealthRequest) returns (HealthReply);

  // Read-only views of the durable session store (ADR-0021): the overlay's chat
  // list + switcher + cycling. Snapshots, not streams; they add no write path and
  // so cannot touch the one hard rule beyond reading what the store already holds.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsReply);
  rpc GetSessionMessages(GetSessionMessagesRequest) returns (GetSessionMessagesReply);

  // Reminder pull-delivery (ADR-0025): the overlay surfaces fired-but-undelivered reminders when it
  // opens and acks what it showed.
  rpc ListDueReminders(ListDueRemindersRequest) returns (ListDueRemindersReply);
  rpc AckReminder(AckReminderRequest) returns (AckReminderReply);

  // Rename a chat: a gated WRITE on the session catalog (ADR-0021 management addendum), the
  // overlay's user-driven relabel of one chat.
  rpc RenameSession(RenameSessionRequest) returns (RenameSessionReply);

  // Delete a chat: a gated, DESTRUCTIVE, irreversible WRITE on the session catalog (ADR-0021
  // management addendum).
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionReply);

  // Pin or unpin a chat: a gated WRITE on the session catalog (ADR-0021 management addendum).
  rpc SetSessionPinned(SetSessionPinnedRequest) returns (SetSessionPinnedReply);

  // The user's own settings: a durable key/value record the BRAIN owns, so a choice survives a body
  // restart or a body reinstall and is readable by any surface rather than trapped in the one that
  // set it.
  rpc GetPreferences(GetPreferencesRequest) returns (GetPreferencesReply);
  rpc SetPreference(SetPreferenceRequest) returns (SetPreferenceReply);
}

message ClientEvent {
  string session_id = 1;
  oneof event {
    UserTurn user_turn = 2;   // text (+ optional attached capture) from the overlay
    Cancel cancel = 3;        // stop generating the current turn
    ConfirmResponse confirm_response = 4; // the user's answer to a ConfirmRequest (ADR-0022)
  }
}

message UserTurn {
  string text = 1;
  repeated ImageBlob images = 2; // e.g. a screen capture the user attached
}

message Cancel {}

message ServerEvent {
  oneof event {
    TextDelta text_delta = 1;      // streamed assistant tokens
    ToolActivity tool_activity = 2; // "reading email...", audit-visible tool use
    StatusUpdate status = 3;        // model swap in progress, queue position, etc.
    TurnComplete turn_complete = 4;
    SeamError error = 5;
    ConfirmRequest confirm_request = 6; // a gated tool call awaits user approval (ADR-0022)
    ConfirmResolved confirm_resolved = 7; // the brain stopped waiting for an answer (ADR-0022)
    ToolOutcome tool_outcome = 8;   // how a dispatch already announced above ended (ADR-0029)
  }
}

message TextDelta { string text = 1; }
message ToolActivity { string tool_name = 1; string summary = 2; }

// How one announced dispatch ENDED, emitted after it resolves (ADR-0029 outcome addendum).
message ToolOutcome { string tool_name = 1; bool ok = 2; }
message StatusUpdate { string state = 1; string detail = 2; }
message TurnComplete { string turn_id = 1; }
message SeamError { string code = 1; string message = 2; }

// Out-of-band user confirmation of a gated (outbound/irreversible) tool call (ADR-0022).
message ConfirmRequest {
  string confirm_id = 1;      // correlation id, minted per request by the brain
  string tool_name = 2;       // what would run, e.g. "send_email"
  string arguments_json = 3;  // the exact draft being approved, one JSON object
  string reason = 4;          // why confirmation is required, shown verbatim
}
message ConfirmResponse {
  string confirm_id = 1;      // echoes the request it answers
  bool approved = 2;
}

// A ConfirmRequest the brain stopped waiting on, so the overlay can close a card the user can no
// longer answer (ADR-0022 resolution addendum).
message ConfirmResolved {
  string confirm_id = 1;      // which ConfirmRequest ended
  string outcome = 2;         // "timeout" | "unavailable"; explains, never authorizes
}

message HealthRequest {}
message HealthReply { bool ready = 1; string detail = 2; }

// Recent chats, most-recently-active first (ADR-0021). `limit` caps the count;
// 0 means the server default.
message ListSessionsRequest { int32 limit = 1; }
message ListSessionsReply { repeated SessionSummary sessions = 1; }
message SessionSummary {
  string session_id = 1;
  string title = 2;                // derived: first user message, one line, truncated
  string preview = 3;              // derived: last message text, one line, truncated
  int64 last_activity_unix_ms = 4; // for a relative timestamp in the switcher
  bool pinned = 5;                 // the user pinned this chat above the recency window (unioned in)
}

// One session's persisted history, in append order (ADR-0021).
message GetSessionMessagesRequest { string session_id = 1; }
message GetSessionMessagesReply { repeated SessionMessage messages = 1; }
message SessionMessage {
  string role = 1; // "user" | "assistant" (the only persisted roles)
  string text = 2;
  string turn_id = 3;
  int64 at_unix_ms = 4;
}

// Rename one chat (ADR-0021 management addendum).
message RenameSessionRequest {
  string session_id = 1;
  string title = 2;
}
message RenameSessionReply {}

// Delete one chat (ADR-0021 management addendum).
message DeleteSessionRequest {
  string session_id = 1;
}
message DeleteSessionReply {}

// Pin or unpin one chat (ADR-0021 management addendum).
message SetSessionPinnedRequest {
  string session_id = 1;
  bool pinned = 2;
}
message SetSessionPinnedReply {}

// The user's settings record. One pair is one setting; the brain stores and returns them
// verbatim and never parses a value, so adding a preference costs no wire change.
message Preference {
  string key = 1;
  string value = 2;
}
message GetPreferencesRequest {}
message GetPreferencesReply { repeated Preference preferences = 1; }
message SetPreferenceRequest {
  string key = 1;
  string value = 2;
}
message SetPreferenceReply {}

// Reminder pull-delivery views (ADR-0025). All sessions are listed deliberately because
// a single-user assistant has one user to remind; session_id rides along so the
// overlay can later offer "open the conversation this came from" without a wire change.
message ListDueRemindersRequest {}
message ListDueRemindersReply { repeated DueReminder reminders = 1; }
message DueReminder {
  string reminder_id = 1;
  string text = 2;
  int64 fired_at_unix_ms = 3; // when it became deliverable
  bool recurring = 4;
  bool tainted = 5;           // untrusted provenance, so the overlay may badge it
  string session_id = 6;      // origin chat, filled at creation; "" for session-less callers
}
message AckReminderRequest { string reminder_id = 1; }
message AckReminderReply { bool acked = 1; }

// --------------------------------------------------------------------------- BodyService is hosted
// by the body (host-native).
service BodyService {
  rpc CaptureScreen(CaptureScreenRequest) returns (CaptureScreenReply);
  rpc GetVolume(GetVolumeRequest) returns (VolumeState);
  rpc SetVolume(SetVolumeRequest) returns (VolumeState);
  rpc InjectInput(InjectInputRequest) returns (InjectInputReply);
  // Show a native notification (ADR-0025): the brain->body push half of reminder delivery.
  rpc Notify(NotifyRequest) returns (NotifyReply);
}

message CaptureScreenRequest {
  // Longest edge of the returned image, in physical pixels. 0 means "the body's
  // default" (1600). The body clamps it and, being proto3, may ignore it entirely,
  // so it is a hint the brain re-verifies on receipt, never a guarantee (ADR-0029).
  uint32 max_edge = 1;
  // Field 2 is reserved for a display index once anything enumerates monitors; v1 is the primary
  // display only.
  uint32 max_bytes = 3;
}
message CaptureScreenReply { ImageBlob image = 1; }

message ImageBlob {
  bytes data = 1;
  string mime_type = 2; // e.g. image/png
  uint32 width = 3;     // physical pixels, after the body's downscale
  uint32 height = 4;
  // The display's own size before the downscale, so the model can say "that text
  // is too small for me to read" instead of guessing (ADR-0029).
  uint32 source_width = 5;
  uint32 source_height = 6;
  // When the pixels were read, so a multi-round turn can reason about staleness.
  int64 captured_at_unix_ms = 7;
}

message GetVolumeRequest {}
message SetVolumeRequest {
  // Both fields have explicit presence so callers can set level, mute, or both.
  optional float level = 1; // clamped to [0.0, 1.0]
  optional bool mute = 2;
}
message VolumeState {
  float level = 1;
  bool muted = 2;
}

message InjectInputRequest {
  oneof input {
    TypeText type_text = 1; // literal text entry
    KeyChord key_chord = 2; // e.g. ctrl+shift+esc
  }
}
message TypeText { string text = 1; }
message KeyChord { repeated string keys = 1; }
message InjectInputReply { bool applied = 1; }

message NotifyRequest {
  string title = 1;
  string body = 2;
  string reminder_id = 3;
  bool tainted = 4; // symmetric with DueReminder, so the toast may badge provenance
}
message NotifyReply { bool shown = 1; }
