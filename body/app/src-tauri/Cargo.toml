[package]
name = "cortex-body"
version = "0.1.0"
edition = "2024"
publish = false
description = "Cortex body, the host-native Tauri shell (overlay + hotkey + brain seam)"

# Its own workspace root, excluded from the gated `body` workspace (ADR-0011
# decision 5): `just check`'s `cargo --workspace` never builds Tauri, so CI needs
# no webkit/node and the coverage gate never sees the app.
[workspace]

[lib]
name = "cortex_body_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cortex-body"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
futures-util = "0.3"
# "sync" for the confirm decision route (ADR-0022); "net" + "rt-multi-thread" for the
# BodyService server the app hosts (ADR-0023), to bind a loopback listener and serve on Tauri's
# runtime; "time" for the transport retry backoff (TokioSleeper, ADR-0024).
tokio = { version = "1", features = ["sync", "net", "rt-multi-thread", "time"] }
# "net" for TcpListenerStream (the BodyService incoming, ADR-0023).
tokio-stream = { version = "0.1", features = ["net"] }
# Serve the BodyService the brain dials (ADR-0023); the adapter lives in body-rpc.
tonic = "0.14"
body-core = { path = "../../crates/core" }
body-rpc = { path = "../../crates/rpc" }

# The real global-hotkey backend is Windows-only (ADR-0011); other platforms have
# no summon hotkey yet, so the crate is not depended on there.
[target.'cfg(windows)'.dependencies]
os-windows = { path = "../../crates/os_windows" }
