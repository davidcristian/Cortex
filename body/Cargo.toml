[workspace]
members = ["crates/core", "crates/rpc"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
body-core = { path = "crates/core" }
prost = "0.14"
thiserror = "2"
tokio = "1"
tokio-stream = "0.1"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# AGENTS.md: no unwrap()/expect() on fallible paths; clippy.toml relaxes both in tests.
unwrap_used = "deny"
expect_used = "deny"
