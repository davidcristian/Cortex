[package]
name = "os-linux"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Linux OS backends for the Cortex body: notifications, volume, capture and hotkey (lib name: os_linux)"

# The backends speak to a Linux desktop session, so the whole crate is `cfg(target_os = "linux")`
# and builds to nothing elsewhere, as `os_windows` does off Windows.
[target.'cfg(target_os = "linux")'.dependencies]
body-core.workspace = true
# The session bus client for freedesktop notifications. Pure Rust, no unsafe in this crate.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
# The X11 client for screen capture and key grabs. Pure Rust with no default features, so no libxcb is linked.
# `randr` lists the monitors, so a capture reads the primary one rather than the whole root.
x11rb = { version = "0.13", default-features = false, features = ["randr"] }
# Decodes the PNG file the screenshot portal writes. Already a body-core dependency.
png.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The shared port check lists the adapters are run against.
body-contract.workspace = true
# `p2p` lets a test serve a fake notification server or portal over a socket pair, with no bus
# daemon, and `bus-impl` gives that client the unique name a portal request handle is built from.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api", "bus-impl", "p2p"] }
# `xtest` lets the live hotkey test press a chord on the X server.
x11rb = { version = "0.13", default-features = false, features = ["randr", "xtest"] }

[lints]
workspace = true
