[package]
name = "body-rpc"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "tonic adapter for the body↔brain gRPC seam (lib name: body_rpc)"

[dependencies]
async-stream.workspace = true
body-core.workspace = true
futures-core.workspace = true
prost.workspace = true
# Promoted from dev-dependencies for the confirm round-trip (ADR-0022): the
# converse request stream chains the caller's decision stream onto the user
# turn with tokio-stream's once/chain/map combinators.
tokio-stream.workspace = true
tonic.workspace = true
tonic-prost.workspace = true

[dev-dependencies]
# "sync" is dev-only: the contract tests' stoppable fake brain uses a oneshot
# to trigger graceful shutdown (brain-death-after-connect scenario).
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync"] }
tokio-stream = { workspace = true, features = ["net"] }

[build-dependencies]
tonic-prost-build.workspace = true

[lints]
workspace = true
