[package]
name = "os-windows"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Windows OS backends for the Cortex body: hotkey, audio, toast (lib name: os_windows)"

# Everything here is `cfg(windows)`: the real backends make Windows OS calls and
# cannot compile elsewhere. On Linux CI the crate builds to nothing (no deps, no
# code), so the coverage gate never measures it (ADR-0011). Deps are Windows-only
# for the same reason. Linux never fetches or builds them.
[target.'cfg(windows)'.dependencies]
body-core.workspace = true
global-hotkey = "0.8"
# Core Audio (IAudioEndpointVolume) for the volume backend (ADR-0023), the WinRT toast for the
# notification backend (ADR-0025), and GDI plus the window-affinity call for the screen-capture
# backend and the overlay's capture self-exclusion (ADR-0029). Those calls are `unsafe`,
# authorized narrowly for this crate (see the `[lints]` note below); the WinRT projections
# themselves are safe.
windows = { version = "0.58", features = [
  "Data_Xml_Dom",
  "Foundation",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }

# os_windows opts OUT of the workspace `unsafe_code = "forbid"` for the Win32 calls its
# backends need (ADR-0023 decision 7): `unsafe` stays denied crate-wide and is re-enabled only
# in the modules that own an authorization, each with its own scoped `#![allow(unsafe_code)]`
# naming the ADR that granted it. There are three: `audio` (Core Audio COM, ADR-0023), `notify`
# (WinRT toasts, ADR-0025), and `screen` (GDI BitBlt, ADR-0029). Because `[lints]` is all-or-nothing,
# the other workspace lints (the `coverage` cfg allowance, clippy pedantic, no unwrap/expect)
# are re-declared here. Every other crate keeps `forbid`.
[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
