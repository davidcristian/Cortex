[package]
name = "os-windows"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Windows OS backends for the Cortex body: hotkey, audio, toast (lib name: os_windows)"

[target.'cfg(windows)'.dependencies]
body-core.workspace = true
global-hotkey = "0.8"
windows = { version = "0.58", features = [
  "Data_Xml_Dom",
  "Foundation",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
