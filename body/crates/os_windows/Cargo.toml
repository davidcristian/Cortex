[package]
name = "os-windows"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Windows OS backends for the Cortex body, hotkey (Slice 8) + audio (Slice 9) (lib name: os_windows)"

[target.'cfg(windows)'.dependencies]
body-core.workspace = true
global-hotkey = "0.8"
# Core Audio (IAudioEndpointVolume) for the volume backend (ADR-0023). COM calls are
# `unsafe`, authorized narrowly for this crate (see the `[lints]` note below).
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
] }

[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
