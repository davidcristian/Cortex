# Run every test suite in a shuffled order at a fresh seed, weekly and on demand. `just check`
# uses a fixed seed, so this is where the other orders come from. It runs the same committed
# recipe a person runs by hand, blocks nothing, and reports a failure with the seed that drew it.
name: Shuffle sweep

on:
  schedule:
    # Weekly, off the hour on purpose: Actions queues most of the world's schedules at the top
    # of one, and nobody is waiting on this run.
    - cron: "41 3 * * 1"
  # Run it from the Actions tab at any time, and repeat a failure by passing its seed back.
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed to sweep at (blank draws a fresh one)"
        required: false
        type: string

# One run at a time. A second run queued behind the first would use a different order anyway.
concurrency:
  group: shuffle-sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    # A bound because a hung test has no other way to end; the default is six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: body/app/package-lock.json
      # Nightly only, because libtest's shuffle is behind `-Z unstable-options`. No stable
      # toolchain and no cargo-llvm-cov: none of the build, lint or coverage steps run here.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (no releases; dependabot updates the SHA only)
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: body
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: just
      - id: draw
        name: Draw the seed this sweep runs at
        env:
          # Passed through the environment rather than interpolated into the script: a `${{ }}`
          # expansion of text a person typed is a shell-injection risk.
          REQUESTED: ${{ inputs.seed }}
        run: |
          set -euo pipefail
          seed="${REQUESTED:-}"
          if [ -z "$seed" ]; then
            seed=$(( (RANDOM << 15) | RANDOM ))
          fi
          case "$seed" in
            *[!0-9]*)
              echo "a seed must be digits only, got '${seed}'" >&2
              exit 1
              ;;
          esac
          echo "seed=${seed}" >> "$GITHUB_OUTPUT"
          # Written before the run, so one that fails, times out or is cancelled still names the
          # order it was using. The summary is the first thing on a run's page.
          {
            echo "## Shuffle sweep"
            echo
            echo "Seed \`${seed}\`. Every gated suite runs its tests in that order."
            echo
            echo "Reproduce this whole sweep locally:"
            echo
            echo '```'
            echo "just shuffle ${seed}"
            echo '```'
            echo
            echo "A red here is an order dependency between two tests that already coexisted,"
            echo "so it is not about the commit this ran on and it blocks nothing. Fix the"
            echo "test, never the seed."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Sweep every suite at that seed
        env:
          SEED: ${{ steps.draw.outputs.seed }}
        run: just shuffle "$SEED"
