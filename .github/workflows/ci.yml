# GPU-less by design (AGENTS.md gate 3): plain ubuntu runners, no CUDA anywhere.
# Both jobs run the same `just` recipes developers run locally (no drift).
# Path-filtered per ADR-0006: each toolchain's job runs when a change can affect it;
# shared gate files (justfile, proto, scripts, this workflow) trigger both.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push supersedes the in-flight run for the same ref (ADR-0006).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'justfile'
              - '.github/workflows/ci.yml'
              - 'proto/**'
              - 'scripts/**'
              - '.python-version'
            python:
              - *shared
              - 'brain/**'
              - 'ruff.toml'
            rust:
              - *shared
              - 'body/**'

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just check-linecap
      - run: just check-brain
      - run: just check-scripts

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nightly first (branch-coverage instrumentation only), stable second so that
      # stable stays the default toolchain (ADR-0002).
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,just
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: body
      # uv is needed because check-body's branch gate runs scripts/coverage_gate.py.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: just check-body
