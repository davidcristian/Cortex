name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer PR push supersedes the in-flight run for the same ref, but every
# master commit keeps its CI verdict, preserving a bisectable history (ADR-0006).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
      overlay: ${{ steps.filter.outputs.overlay }}
      shell: ${{ steps.filter.outputs.shell }}
    steps:
      # fetch-depth 0: the repo is small, and full history makes computing the
      # diff range trivial (merge bases and `before` SHAs are always present).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        name: Classify changed paths (fail-closed)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          range=""
          if [ "${EVENT}" = "pull_request" ]; then
            # Three-dot = diff against the merge base with the PR target.
            # origin has the base branch because fetch-depth is 0 and PR runs
            # check out from the base repo.
            range="origin/${BASE_REF:-}...HEAD"
          elif [ -n "${BEFORE:-}" ] \
            && [ "${BEFORE:-}" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE:-}" 2>/dev/null; then
            range="${BEFORE}..HEAD"
          fi
          if [ -n "${range}" ] && git diff --name-only "${range}" > /dev/null 2>&1; then
            # The classifier is stdlib-only, so plain python3 works with no uv
            # setup in this job. Under pipefail, a classifier error fails this
            # step and therefore the run: visible red, never silently green.
            git diff --name-only "${range}" | python3 scripts/ci_paths.py >> "$GITHUB_OUTPUT"
          else
            echo "No usable diff range (first push, or a force-push whose 'before' is gone); running everything, fail-closed."
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "overlay=true" >> "$GITHUB_OUTPUT"
            echo "shell=true" >> "$GITHUB_OUTPUT"
          fi

  cross-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: just
      - run: just check-linecap
      - run: just check-dashcheck
      - run: just check-crosscheck
      - run: just check-bindcheck
      - run: just check-defaultcheck
      - run: just check-volumecheck
      - run: just check-stubcheck
      - run: just check-samplecheck
      - run: just check-rostercheck
      - run: just check-flagcheck
      - run: just check-backlog

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: just
      - run: just check-brain
      - run: just check-scripts

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Nightly first (branch-coverage instrumentation only), stable second so that
      # stable stays the default toolchain (ADR-0002). The SHA pin drops the
      # @nightly/@stable ref selection, so the toolchain is passed explicitly.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned master (no releases; dependabot bumps the SHA only)
        with:
          toolchain: nightly
          components: llvm-tools-preview
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned master (no releases; dependabot bumps the SHA only)
        with:
          toolchain: stable
          components: rustfmt, clippy
          # check-body clippies the cfg(windows) os_windows backend on this target (which the
          # native workspace compiles to nothing); clippy never links, so no MSVC toolchain is
          # needed. Shell fmt (body/app/src-tauri) needs only rustfmt, already present. ADR-0011.
          targets: x86_64-pc-windows-msvc
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-llvm-cov,just
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: body
      # uv is needed because check-body's branch gate runs scripts/coverage_gate.py.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: just check-body

  shell:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Tauri Linux dev stack (pkg-config metadata only; clippy never links)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned master (no releases; dependabot bumps the SHA only)
        with:
          toolchain: stable
          components: clippy
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: just
      # The shell is its own cargo workspace, so it needs its own cache key; sharing the
      # rust job's would thrash both.
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: body/app/src-tauri
      - run: just check-shell

  overlay:
    needs: changes
    if: needs.changes.outputs.overlay == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: body/app/package-lock.json
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: just
      - run: just check-overlay
