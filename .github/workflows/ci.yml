# GPU-less by design (AGENTS.md gate 3): plain ubuntu runners, no CUDA anywhere.
# Jobs run the same `just` recipes developers run locally (no drift).
# Path filtering is a fail-closed in-repo classifier (scripts/ci_paths.py,
# ADR-0006): unknown paths run every toolchain job, and if the diff range cannot be
# determined we run them all too. The cross-tree scans are exempt from the filter and
# always run; the comment above the `cross-tree` job names each one and says which
# trees it spans, and that comment is a roster the document-roster scan holds to the
# recipes the gate and this workflow both run. Every action is pinned to a full commit
# SHA with a version comment; dependabot (.github/dependabot.yml) keeps the pins fresh.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer PR push supersedes the in-flight run for the same ref, but every
# master commit keeps its CI verdict, preserving a bisectable history (ADR-0006).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
      overlay: ${{ steps.filter.outputs.overlay }}
      shell: ${{ steps.filter.outputs.shell }}
    steps:
      # fetch-depth 0: the repo is small, and full history makes computing the
      # diff range trivial (merge bases and `before` SHAs are always present).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        name: Classify changed paths (fail-closed)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          range=""
          if [ "${EVENT}" = "pull_request" ]; then
            # Three-dot = diff against the merge base with the PR target.
            # origin has the base branch because fetch-depth is 0 and PR runs
            # check out from the base repo.
            range="origin/${BASE_REF:-}...HEAD"
          elif [ -n "${BEFORE:-}" ] \
            && [ "${BEFORE:-}" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE:-}" 2>/dev/null; then
            range="${BEFORE}..HEAD"
          fi
          if [ -n "${range}" ] && git diff --name-only "${range}" > /dev/null 2>&1; then
            # The classifier is stdlib-only, so plain python3 works with no uv
            # setup in this job. Under pipefail, a classifier error fails this
            # step and therefore the run: visible red, never silently green.
            git diff --name-only "${range}" | python3 scripts/ci_paths.py >> "$GITHUB_OUTPUT"
          else
            echo "No usable diff range (first push, or a force-push whose 'before' is gone); running everything, fail-closed."
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "overlay=true" >> "$GITHUB_OUTPUT"
            echo "shell=true" >> "$GITHUB_OUTPUT"
          fi

  # The cross-tree scans are repo-wide and exempt from the path filter, so a Rust-only,
  # overlay-only or docs-only change is still covered. Each one spans trees that no
  # single-toolchain job sees:
  #   linecap.py       caps .py, .rs, .ts and .tsx everywhere (AGENTS.md gate 1).
  #   dashcheck.py     bans a dash used as punctuation in any text file, mostly a docs
  #                    concern, so a toolchain job would never run it.
  #   crosscheck.py    compares constants declared once per language (ADR-0029
  #                    cross-language-constant addendum).
  #   bindcheck.py     reads docker/'s bind defaults against .gitignore.
  #   defaultcheck.py  compares one variable's several compose defaults, spanning the
  #                    override files a single job never sees.
  #   volumecheck.py   checks every volume an image declares against a mount some service
  #                    makes, from a recorded answer, because this runner has no docker
  #                    daemon and no images (ADR-0011 addendum on evidence out of reach).
  #   stubcheck.py     compares the committed Rust seam stub with the comments in
  #                    proto/body.proto, which spans two trees.
  #   samplecheck.py   compares every runbook log line with the call site that writes it,
  #                    a docs tree against a Python one.
  #   rostercheck.py   compares every roster a document keeps with the set it describes,
  #                    a docs tree against two others.
  #   flagcheck.py     checks every subagent server the compose tree starts against the
  #                    flags its tier requires, deriving that set from the stack's own
  #                    wiring and argv, reading docker/ against scripts/ and a runbook.
  #   backlogcheck.py  compares each backlog index with its task files (ADR-0039),
  #                    docs-only, so it would otherwise never run.
  cross-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          tool: just
      - run: just check-linecap
      - run: just check-dashcheck
      - run: just check-crosscheck
      - run: just check-bindcheck
      - run: just check-defaultcheck
      - run: just check-volumecheck
      - run: just check-stubcheck
      - run: just check-samplecheck
      - run: just check-rostercheck
      - run: just check-flagcheck
      - run: just check-backlog

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          tool: just
      - run: just check-brain
      - run: just check-scripts

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Nightly first (branch-coverage instrumentation only), stable second so that
      # stable stays the default toolchain (ADR-0002). The SHA pin drops the
      # @nightly/@stable ref selection, so the toolchain is passed explicitly.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned master (no releases; dependabot bumps the SHA only)
        with:
          toolchain: nightly
          components: llvm-tools-preview
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned master (no releases; dependabot bumps the SHA only)
        with:
          toolchain: stable
          components: rustfmt, clippy
          # check-body clippies the cfg(windows) os_windows backend on this target (which the
          # native workspace compiles to nothing); clippy never links, so no MSVC toolchain is
          # needed. Shell fmt (body/app/src-tauri) needs only rustfmt, already present. ADR-0011.
          targets: x86_64-pc-windows-msvc
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          tool: cargo-llvm-cov,just
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: body
      # uv is needed because check-body's branch gate runs scripts/coverage_gate.py.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: just check-body

  # The Tauri shell at body/app/src-tauri/ (ADR-0011 shell-clippy addendum). The rust job
  # above only fmt-checks the shell, which parses without building; clippy has to compile it,
  # so this is the ONE job that installs system libraries, and the only one running a `just`
  # recipe that local `just check` does not. It is filtered onto the `shell` output, which
  # only a body/app/src-tauri/ edit (or a shared gate file, fail-closed) sets, so no other
  # body/ change pays the apt line. Clippy never links: the packages are installed for the
  # pkg-config metadata their -sys build scripts probe for, and none of the libraries is
  # loaded. libsoup-3.0-dev and libjavascriptcoregtk-4.1-dev arrive as webkit's own deps.
  # binutils-mingw-w64-x86-64 is for the second clippy the recipe runs, on the Windows target:
  # it supplies the GNU windres that tauri-build's VERSIONINFO resource step needs, since no
  # rustup toolchain ships the llvm-rc embed-resource reaches for by default (ADR-0011
  # windows-shell addendum). That target has to be installed here as well; the rust job's
  # copy belongs to a different job.
  # GPU-less like every other job, and this still LINTS the shell rather than running it,
  # which wants a real Win32 desktop session (docs/host/).
  shell:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Tauri Linux dev stack and a resource compiler (clippy never links)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev binutils-mingw-w64-x86-64
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned master (no releases; dependabot bumps the SHA only)
        with:
          toolchain: stable
          components: clippy
          targets: x86_64-pc-windows-msvc
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          tool: just
      # The shell is its own cargo workspace, so it needs its own cache key; sharing the
      # rust job's would thrash both.
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: body/app/src-tauri
      - run: just check-shell

  # The React overlay under body/app/ (ADR-0011 addendum): a host-only node toolchain,
  # gated at 100% line+branch by check-overlay (Vitest + v8). Path-filtered like the
  # others (ADR-0006); the Tauri src-tauri shell in the same tree is a separate job above,
  # since it is Rust and needs webkit. GPU-less by construction. This is npm + jsdom only.
  overlay:
    needs: changes
    if: needs.changes.outputs.overlay == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: body/app/package-lock.json
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          tool: just
      - run: just check-overlay
